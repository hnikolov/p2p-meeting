<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Meeting via Secret Key</title>
    <link rel="icon" href="data:,">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #202124; color: white; margin: 0; padding: 20px; }
        .setup-panel { background: #303134; padding: 20px; border-radius: 8px; margin-bottom: 20px; width: 100%; max-width: 500px; box-sizing: border-box; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        input { padding: 12px; border-radius: 4px; border: 1px solid #5f6368; background: #202124; color: white; font-size: 16px; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; color: white; transition: background 0.2s; }
        .btn-start { background: #1a73e8; }
        .btn-start:hover { background: #1557b0; }
        .btn-join { background: #12b886; }
        .btn-join:hover { background: #0ca678; }
        .controls-row { display: flex; gap: 15px; margin-top: 20px; justify-content: center; width: 100%; }
        .btn-control { max-width: 160px; font-size: 13px; }
        #muteBtn { background: #ea4335; }
        #camBtn { background: #1a73e8; }
        
        .status-bar { margin: 10px 0; font-size: 14px; color: #aecbfa; font-weight: bold; }
        .diagnostics-panel { width: 100%; max-width: 980px; margin: 0 0 16px; padding: 12px 14px; border: 1px solid #3c4043; border-radius: 8px; background: #151618; color: #d2e3fc; box-sizing: border-box; }
        .diagnostics-panel summary { cursor: pointer; font-weight: bold; color: #8ab4f8; }
        .diagnostics-panel pre { margin: 10px 0 0; white-space: pre-wrap; word-break: break-word; font-size: 12px; line-height: 1.45; }
        .video-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .video-box { position: relative; }
        video { width: 45vw; max-width: 480px; min-width: 280px; height: 320px; background: #000; border-radius: 8px; transform: scaleX(-1); object-fit: cover; border: 2px solid #3c4043; }
        #remoteVideo { transform: none; }
        .video-label { position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

    <h1>P2P Serverless Meeting</h1>
    
    <!-- Unified Setup Control Panel -->
    <div class="setup-panel">
        <div class="input-group">
            <label for="roomKey">Enter Shared Secret Key:</label>
            <input type="text" id="roomKey" placeholder="e.g., hristo-room" autocomplete="off">
        </div>
        <div class="btn-group">
            <button id="startBtn" class="btn-start">Start a New Call</button>
            <button id="joinBtn" class="btn-join">Join Existing Call</button>
        </div>
    </div>

    <div id="statusText" class="status-bar">Camera active. Enter a key above to connect.</div>

    <details class="diagnostics-panel">
        <summary>Diagnostics</summary>
        <pre id="diagnosticsText">Waiting for local media...</pre>
    </details>

    <div class="input-group">
        <label for="audioSource">Microphone:</label>
        <select id="audioSource"></select>
    </div>
    <div class="input-group">
        <label for="videoSource">Camera:</label>
        <select id="videoSource"></select>
    </div>

    <div class="video-container">
        <div class="video-box">
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="video-label">You (Local)</div>
        </div>
        <div class="video-box">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="video-label">Friend (Remote)</div>
        </div>
    </div>

    <!-- Media Controls Row -->
    <div class="controls-row">
        <button id="muteBtn" class="btn-control" data-muted="false">Mute Audio</button>
        <button id="camBtn" class="btn-control" data-off="false">Turn Camera Off</button>
    </div>

    <!-- Offline-Safe Script Routing -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getDatabase, ref, set, onChildAdded, onValue, remove } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";
        
        // Replace with your actual Firebase project configuration parameters here
        const firebaseConfig = {
            apiKey: "AIzaSyB2F_QfZFAwitJrFEcvCTadOsLOVETkRpg",
            authDomain: "p2p-meeting-c4e09.firebaseapp.com",
            databaseURL: "https://p2p-meeting-c4e09-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "p2p-meeting-c4e09",
            storageBucket: "p2p-meeting-c4e09.firebasestorage.app",
            messagingSenderId: "977559758143",
            appId: "1:977559758143:web:014c42c579988a25555f8a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let localStream;
        let remoteStream = null;
        let peerConnection;
        let activeRoomName = null;
        let localParticipantRole = null;
        let remoteIceQueue = [];
        let signalingUnsubscribers = [];
        let joinTimeoutId = null;

        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }]
        };

        const roomKeyInput = document.getElementById('roomKey');
        const startBtn = document.getElementById('startBtn');
        const joinBtn = document.getElementById('joinBtn');
        const muteBtn = document.getElementById('muteBtn');
        const camBtn = document.getElementById('camBtn');
        const statusText = document.getElementById('statusText');
        const diagnosticsText = document.getElementById('diagnosticsText');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const audioSource = document.getElementById('audioSource');
        const videoSource = document.getElementById('videoSource');

        function describeTrack(track) {
            if (!track) return 'none';

            return [
                `kind=${track.kind}`,
                `id=${track.id}`,
                `enabled=${track.enabled}`,
                `muted=${track.muted}`,
                `readyState=${track.readyState}`
            ].join(', ');
        }

        function updateDiagnostics(reason = 'state update') {
            const senders = peerConnection ? peerConnection.getSenders() : [];
            const receivers = peerConnection ? peerConnection.getReceivers() : [];
            const localAudioTrack = localStream ? localStream.getAudioTracks()[0] : null;
            const localVideoTrack = localStream ? localStream.getVideoTracks()[0] : null;
            const remoteTracks = remoteStream ? remoteStream.getTracks() : [];
            const receiverTracks = receivers.map(receiver => receiver.track).filter(Boolean);

            diagnosticsText.textContent = [
                `reason: ${reason}`,
                `role: ${localParticipantRole || 'none'}`,
                `room: ${activeRoomName || 'none'}`,
                `connectionState: ${peerConnection ? peerConnection.connectionState : 'none'}`,
                `signalingState: ${peerConnection ? peerConnection.signalingState : 'none'}`,
                `iceConnectionState: ${peerConnection ? peerConnection.iceConnectionState : 'none'}`,
                `local audio: ${describeTrack(localAudioTrack)}`,
                `local video: ${describeTrack(localVideoTrack)}`,
                `remote stream tracks: ${remoteTracks.length ? remoteTracks.map(describeTrack).join(' | ') : 'none'}`,
                `receiver tracks: ${receiverTracks.length ? receiverTracks.map(describeTrack).join(' | ') : 'none'}`,
                `sender tracks: ${senders.length ? senders.map(sender => describeTrack(sender.track)).join(' | ') : 'none'}`,
                `queued ICE candidates: ${remoteIceQueue.length}`,
                `local video readyState: ${localVideo.readyState}`,
                `remote video readyState: ${remoteVideo.readyState}`
            ].join('\n');
        }

        function setCallButtonsEnabled(enabled) {
            startBtn.disabled = !enabled;
            joinBtn.disabled = !enabled;
        }

        function setDeviceControlsEnabled(enabled) {
            audioSource.disabled = !enabled;
            videoSource.disabled = !enabled;
            muteBtn.disabled = !enabled;
            camBtn.disabled = !enabled;
        }

        function clearJoinTimeout() {
            if (joinTimeoutId) {
                clearTimeout(joinTimeoutId);
                joinTimeoutId = null;
            }
        }

        function unsubscribeRoomListeners() {
            signalingUnsubscribers.forEach(unsubscribe => unsubscribe());
            signalingUnsubscribers = [];
        }

        function closePeerConnection() {
            if (!peerConnection) return;

            peerConnection.ontrack = null;
            peerConnection.onicecandidate = null;
            peerConnection.onconnectionstatechange = null;
            peerConnection.close();
            peerConnection = null;
            remoteStream = null;
            remoteIceQueue = [];
            updateDiagnostics('peer connection closed');
        }

        async function cleanupRoomArtifacts() {
            if (!activeRoomName || !localParticipantRole) return;

            const roomBasePath = `rooms/${activeRoomName}`;
            const cleanupTasks = localParticipantRole === 'caller'
                ? [
                    remove(ref(db, `${roomBasePath}/offer`)),
                    remove(ref(db, `${roomBasePath}/callerCandidates`))
                ]
                : [
                    remove(ref(db, `${roomBasePath}/answer`)),
                    remove(ref(db, `${roomBasePath}/calleeCandidates`))
                ];

            await Promise.allSettled(cleanupTasks);
        }

        async function resetCallSession(statusMessage) {
            clearJoinTimeout();
            unsubscribeRoomListeners();
            closePeerConnection();
            remoteVideo.srcObject = null;
            await cleanupRoomArtifacts();
            activeRoomName = null;
            localParticipantRole = null;
            setCallButtonsEnabled(Boolean(localStream));
            updateDiagnostics('call session reset');

            if (statusMessage) {
                statusText.innerText = statusMessage;
            }
        }

        async function addRemoteIceCandidate(candidateData) {
            if (!peerConnection) return;

            const iceCandidate = new RTCIceCandidate(candidateData);
            if (!peerConnection.remoteDescription) {
                remoteIceQueue.push(iceCandidate);
                updateDiagnostics('queued remote ICE');
                return;
            }

            await peerConnection.addIceCandidate(iceCandidate);
            updateDiagnostics('applied remote ICE');
        }

        async function flushRemoteIceQueue() {
            while (peerConnection && peerConnection.remoteDescription && remoteIceQueue.length > 0) {
                const candidate = remoteIceQueue.shift();

                try {
                    await peerConnection.addIceCandidate(candidate);
                } catch (err) {
                    console.warn('Queued ICE candidate skipped:', err);
                }
            }

            updateDiagnostics('flushed queued ICE');
        }

        function ensureLocalStreamReady() {
            if (localStream) return true;

            statusText.innerText = 'Camera and microphone access are required before starting a call.';
            return false;
        }

        setCallButtonsEnabled(false);
        setDeviceControlsEnabled(false);

        async function discoverDevices() {
            // Fetch all connected audio and video hardware
            const devices = await navigator.mediaDevices.enumerateDevices();
            
            // Clear existing options
            audioSource.innerHTML = '';
            videoSource.innerHTML = '';

            devices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.deviceId;

                if (device.kind === 'audioinput') {
                    option.text = device.label || `Microphone ${audioSource.length + 1}`;
                    audioSource.appendChild(option);
                } else if (device.kind === 'videoinput') {
                    option.text = device.label || `Camera ${videoSource.length + 1}`;
                    videoSource.appendChild(option);
                }
            });

            setDeviceControlsEnabled(true);
        }

        // Step 1: Open Local Hardware Feed
        async function init() {
            try {
                // Optimized media constraints for maximum audio stability
                const constraints = { 
                    video: {
                        width: { ideal: 640, max: 640 },
                        height: { ideal: 480, max: 480 },
                        frameRate: { ideal: 15, max: 15 } // Cuts video data transmission in half
                    }, 
                    audio: {
                        echoCancellation: true, // Prevents feedback loops
                        noiseSuppression: true, // Filters background hums
                        autoGainControl: true // Prevents clipping if you speak too loudly
                    }
                };

                // Request hardware access first (triggers browser permission pop-up)
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localVideo.srcObject = localStream;
                localStream.getTracks().forEach(track => {
                    track.addEventListener('mute', () => updateDiagnostics(`local ${track.kind} muted`));
                    track.addEventListener('unmute', () => updateDiagnostics(`local ${track.kind} unmuted`));
                    track.addEventListener('ended', () => updateDiagnostics(`local ${track.kind} ended`));
                });

                // Scan the available hardware and populate your dropdown menus
                await discoverDevices();
                setCallButtonsEnabled(true);
                statusText.innerText = "Camera active. Enter a key above to connect.";
                updateDiagnostics('local media ready');
            } catch (err) {
                statusText.innerText = "Error: System camera/microphone access denied.";
                setCallButtonsEnabled(false);
                setDeviceControlsEnabled(false);
                console.error(err);
                updateDiagnostics('local media failed');
            }
        }

        // Step 2: Build WebRTC Engine Isolated Inside the Secret Room Node
        function createPeerConnection(roomName) {
            if (!localStream) {
                throw new Error('Local media stream is not ready.');
            }

            closePeerConnection();
            peerConnection = new RTCPeerConnection(rtcConfig);
            remoteStream = new MediaStream();
            remoteVideo.srcObject = remoteStream;
            remoteIceQueue = [];

            // 1. Add the local tracks using the most broadly compatible WebRTC path.
            const audioTrack = localStream.getAudioTracks()[0];
            const videoTrack = localStream.getVideoTracks()[0];

            if (audioTrack) {
                const audioSender = peerConnection.addTrack(audioTrack, localStream);
                const audioParameters = audioSender.getParameters();
                audioParameters.encodings = audioParameters.encodings && audioParameters.encodings.length > 0
                    ? audioParameters.encodings.map(encoding => ({ ...encoding, priority: 'high' }))
                    : [{ priority: 'high' }];
                audioSender.setParameters(audioParameters).catch(err => console.error('Audio sender parameter error:', err));
            }

            if (videoTrack) {
                const videoSender = peerConnection.addTrack(videoTrack, localStream);
                const videoParameters = videoSender.getParameters();
                videoParameters.encodings = videoParameters.encodings && videoParameters.encodings.length > 0
                    ? videoParameters.encodings.map(encoding => ({ ...encoding, priority: 'low', maxBitrate: 400000 }))
                    : [{ priority: 'low', maxBitrate: 400000 }];
                videoParameters.degradationPreference = 'maintain-framerate';
                videoSender.setParameters(videoParameters).catch(err => console.error('Video sender parameter error:', err));
            }

            peerConnection.ontrack = (event) => {
                if (!remoteStream) {
                    remoteStream = new MediaStream();
                    remoteVideo.srcObject = remoteStream;
                }

                const existingTrackIds = new Set(remoteStream.getTracks().map(track => track.id));
                if (!existingTrackIds.has(event.track.id)) {
                    remoteStream.addTrack(event.track);
                }

                event.track.addEventListener('mute', () => updateDiagnostics(`remote ${event.track.kind} muted`));
                event.track.addEventListener('unmute', () => updateDiagnostics(`remote ${event.track.kind} unmuted`));
                event.track.addEventListener('ended', () => updateDiagnostics(`remote ${event.track.kind} ended`));

                statusText.innerText = "Connected! Peer media stream verified.";
                updateDiagnostics(`remote ${event.track.kind} track received`);
            };

            // Write local network candidates straight to Firebase
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    const candidateId = `candidate_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
                    const candidateGroup = localParticipantRole === 'caller' ? 'callerCandidates' : 'calleeCandidates';
                    const candRef = ref(db, `rooms/${roomName}/${candidateGroup}/${candidateId}`);
                    set(candRef, { candidate: event.candidate.toJSON() });
                    updateDiagnostics('local ICE candidate emitted');
                }
            };

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'connected') {
                    clearJoinTimeout();
                    statusText.innerText = 'Connected! Peer connection established.';
                    updateDiagnostics('peer connection connected');
                    return;
                }

                if (peerConnection.connectionState === 'failed') {
                    resetCallSession('Connection failed. You can try the same room key again.');
                    return;
                }

                updateDiagnostics(`connection state changed to ${peerConnection.connectionState}`);
            };

            updateDiagnostics('peer connection created');
        }

        // Alphanumeric character validator
        function getValidatedKey() {
            const key = roomKeyInput.value.trim().replace(/[^a-zA-Z0-9-_]/g, '');
            if (!key) {
                alert("Please enter a valid alphanumeric key.");
                return null;
            }
            return key;
        }

        // Action A: Host starts the call session
        startBtn.addEventListener('click', async () => {
            if (!ensureLocalStreamReady()) return;

            const roomName = getValidatedKey();
            if (!roomName) return;

            setCallButtonsEnabled(false);
            activeRoomName = roomName;
            localParticipantRole = 'caller';
            statusText.innerText = `Initializing room "${roomName}"...`;

            try {
                // Flush out lingering historical database records for a fresh connection
                const roomRef = ref(db, `rooms/${roomName}`);
                await remove(roomRef);

                createPeerConnection(roomName);
                listenToRoom(roomName);

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                updateDiagnostics('local offer created');

                // Write the local connection configurations to the secret database cluster
                const offerRef = ref(db, `rooms/${roomName}/offer`);
                await set(offerRef, { sdp: { type: offer.type, sdp: offer.sdp } });

                statusText.innerText = `Room "${roomName}" created. Waiting for friend to join...`;
            } catch (err) {
                console.error('Failed to start room:', err);
                await resetCallSession('Could not create the room. Check Firebase connectivity and try again.');
            }
        });

        // Action B: Client joins the call session
        joinBtn.addEventListener('click', async () => {
            if (!ensureLocalStreamReady()) return;

            const roomName = getValidatedKey();
            if (!roomName) return;

            setCallButtonsEnabled(false);
            activeRoomName = roomName;
            localParticipantRole = 'callee';
            statusText.innerText = `Connecting to room "${roomName}"...`;

            try {
                createPeerConnection(roomName);
                listenToRoom(roomName);
                clearJoinTimeout();
                updateDiagnostics('waiting for remote offer');
                joinTimeoutId = setTimeout(() => {
                    if (peerConnection && !peerConnection.remoteDescription) {
                        resetCallSession(`No active call was found for room "${roomName}".`);
                    }
                }, 15000);
            } catch (err) {
                console.error('Failed to join room:', err);
                await resetCallSession('Could not join the room. Check the shared key and try again.');
            }
        });

        // Step 3: Event Sync Engine mapped to the shared room tree
        function listenToRoom(roomName) {
            unsubscribeRoomListeners();

            const remoteSdpPath = localParticipantRole === 'caller'
                ? `rooms/${roomName}/answer`
                : `rooms/${roomName}/offer`;
            const remoteCandidatesPath = localParticipantRole === 'caller'
                ? `rooms/${roomName}/calleeCandidates`
                : `rooms/${roomName}/callerCandidates`;

            const unsubscribeSdp = onValue(ref(db, remoteSdpPath), async (snapshot) => {
                const data = snapshot.val();
                if (!data || !peerConnection || !data.sdp) return;

                try {
                    if (peerConnection.remoteDescription && peerConnection.remoteDescription.sdp === data.sdp.sdp) {
                        return;
                    }

                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    await flushRemoteIceQueue();
                    updateDiagnostics(`remote ${data.sdp.type} applied`);

                    if (data.sdp.type === 'offer' && localParticipantRole === 'callee' && !peerConnection.localDescription) {
                        clearJoinTimeout();
                        statusText.innerText = 'Processing call invitation...';
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        updateDiagnostics('local answer created');

                        const answerRef = ref(db, `rooms/${roomName}/answer`);
                        await set(answerRef, { sdp: { type: answer.type, sdp: answer.sdp } });
                        statusText.innerText = 'Answer transmitted. Syncing streams...';
                    }
                } catch (err) {
                    console.error('Remote SDP handling failed:', err);
                    await resetCallSession('Signaling failed while exchanging session data. Try again.');
                }
            });

            const unsubscribeCandidates = onChildAdded(ref(db, remoteCandidatesPath), async (snapshot) => {
                const data = snapshot.val();
                if (!data || !data.candidate || !peerConnection) return;

                try {
                    await addRemoteIceCandidate(data.candidate);
                } catch (err) {
                    console.warn('ICE candidate skipped:', err);
                }
            });

            signalingUnsubscribers.push(unsubscribeSdp, unsubscribeCandidates);
        }

        // Hardware Controls: Audio Mute Switch
        muteBtn.addEventListener('click', () => {
            if (!localStream) return;

            const audioTracks = localStream.getAudioTracks();
            if (audioTracks.length > 0) {
                const isMuted = muteBtn.getAttribute('data-muted') === 'true';
                audioTracks[0].enabled = isMuted; // Toggle transmission states
                muteBtn.setAttribute('data-muted', !isMuted);
                muteBtn.innerText = isMuted ? "Mute Audio" : "Unmute Audio";
                muteBtn.style.background = isMuted ? "#ea4335" : "#34a853";
                updateDiagnostics(`local audio ${isMuted ? 'enabled' : 'muted'}`);
            }
        });

        // Hardware Controls: Camera On/Off Toggle
        camBtn.addEventListener('click', () => {
            if (!localStream) return;

            const videoTracks = localStream.getVideoTracks();
            if (videoTracks.length > 0) {
                const isCamOff = camBtn.getAttribute('data-off') === 'true';
                videoTracks[0].enabled = isCamOff; // Toggle transmission states
                camBtn.setAttribute('data-off', !isCamOff);
                camBtn.innerText = isCamOff ? "Turn Camera Off" : "Turn Camera On";
                camBtn.style.background = isCamOff ? "#1a73e8" : "#ea4335";
                updateDiagnostics(`local video ${isCamOff ? 'enabled' : 'disabled'}`);
            }
        });

        // Seamless Video Camera Switcher
        videoSource.addEventListener('change', async (event) => {
            if (!localStream) return;

            const videoDeviceId = event.target.value;
            if (!videoDeviceId) return;

            try {
                // Capture new camera using your lightweight bandwidth constraints
                const newStream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        deviceId: { exact: videoDeviceId }, 
                        width: { ideal: 640, max: 640 }, 
                        height: { ideal: 480, max: 480 }, 
                        frameRate: { ideal: 15, max: 15 } 
                    }
                });
                
                const newVideoTrack = newStream.getVideoTracks()[0];
                const oldVideoTrack = localStream.getVideoTracks()[0];

                // Swap the track in your local camera preview window
                localStream.removeTrack(oldVideoTrack);
                oldVideoTrack.stop(); // Turn off the old camera hardware to save battery
                localStream.addTrack(newVideoTrack);
                localVideo.srcObject = localStream;

                // Seamlessly hot-swap the video track across the live connection to your friend
                if (peerConnection) {
                    const senders = peerConnection.getSenders();
                    const videoSender = senders.find(s => s.track && s.track.kind === 'video');
                    if (videoSender) {
                        await videoSender.replaceTrack(newVideoTrack);
                    }
                }

                updateDiagnostics('video source switched');
            } catch (err) {
                console.error("Failed to switch camera source:", err);
                alert("Could not switch to the selected camera hardware.");
                updateDiagnostics('video source switch failed');
            }
        });

        // Seamless Microphone Switcher
        audioSource.addEventListener('change', async (event) => {
            if (!localStream) return;

            const audioDeviceId = event.target.value;
            if (!audioDeviceId) return;

            try {
                // Capture new microphone using your echo/noise audio filters
                const newStream = await navigator.mediaDevices.getUserMedia({
                    audio: { 
                        deviceId: { exact: audioDeviceId },
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                
                const newAudioTrack = newStream.getAudioTracks()[0];
                const oldAudioTrack = localStream.getAudioTracks()[0];

                // If your mute button is currently active, ensure the new track matches that state
                const isCurrentlyMuted = muteBtn.getAttribute('data-muted') === 'true';
                newAudioTrack.enabled = !isCurrentlyMuted;

                // Swap the track in your local processing memory
                localStream.removeTrack(oldAudioTrack);
                oldAudioTrack.stop(); // Shut down old microphone hardware processing
                localStream.addTrack(newAudioTrack);

                // Seamlessly hot-swap the audio track across the live connection to your friend
                if (peerConnection) {
                    const senders = peerConnection.getSenders();
                    const audioSender = senders.find(s => s.track && s.track.kind === 'audio');
                    if (audioSender) {
                        await audioSender.replaceTrack(newAudioTrack);
                    }
                }

                updateDiagnostics('audio source switched');
            } catch (err) {
                console.error("Failed to switch microphone source:", err);
                alert("Could not switch to the selected microphone hardware.");
                updateDiagnostics('audio source switch failed');
            }
        });

        // Step 4: Automatic Room Clean-up Execution
        // Triggers instantly when a participant exits the page or closes the browser tab
        function cleanupRoomOnExit() {
            if (!activeRoomName || !localParticipantRole) return;

            const roomBasePath = `rooms/${activeRoomName}`;
            if (localParticipantRole === 'caller') {
                remove(ref(db, `${roomBasePath}/offer`));
                remove(ref(db, `${roomBasePath}/callerCandidates`));
            } else {
                remove(ref(db, `${roomBasePath}/answer`));
                remove(ref(db, `${roomBasePath}/calleeCandidates`));
            }
        }

        window.addEventListener('beforeunload', cleanupRoomOnExit);
        window.addEventListener('pagehide', cleanupRoomOnExit);

        window.onload = init;
    </script>
</body>
</html>
