<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#202124">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="P2P Meeting">
<title>P2P Meeting via Secret Key</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --app-vh: 100dvh;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
}
* {
  box-sizing: border-box;
}
body {
  font-family: sans-serif;
  background: #202124;
  color: white;
  margin: 0;
  padding: calc(12px + var(--safe-top)) calc(12px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(12px + var(--safe-left));
  height: var(--app-vh);
  min-height: var(--app-vh);
  overflow: hidden;
}
.app-shell {
  width: 100%;
  max-width: 1300px;
  margin: 0 auto;
  height: 100%;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 10px;
}
.video-stage {
  position: relative;
  width: 100%;
  min-height: 0;
  height: 100%;
  background: #000;
  border: 2px solid #3c4043;
  border-radius: 10px;
  overflow: hidden;
}
.main-video-host {
  width: 100%;
  height: 100%;
}
.main-video-host video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}
#remoteVideo {
  transform: none;
}
.pip-card {
  position: absolute;
  right: 16px;
  bottom: 16px;
  width: min(24vw, 320px);
  min-width: 190px;
  aspect-ratio: 4 / 3;
  border: 2px solid #3c4043;
  border-radius: 8px;
  overflow: hidden;
  background: #000;
  transition: top 0.18s ease, right 0.18s ease, bottom 0.18s ease, left 0.18s ease, transform 0.18s ease, width 0.18s ease;
}
.pip-video-host {
  width: 100%;
  height: 100%;
}
.pip-video-host video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}
#localVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
  background: #000;
}
.video-label {
  position: absolute;
  bottom: 10px;
  left: 10px;
  background: rgba(0,0,0,0.6);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 12px;
}
.remote-label {
  z-index: 2;
}

/* Consolidated Controls Footer Area */
.app-footer {
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}
.bottom-bar {
  background: #303134;
  border: 1px solid #3c4043;
  border-radius: 10px;
  padding: 8px 12px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  min-height: 52px;
}
.bottom-card {
  border: 1px solid #3c4043;
  border-radius: 8px;
  padding: 8px 10px;
  background: #202124;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.bottom-card-left {
  justify-content: flex-start;
}
.bottom-card-center {
  justify-content: center;
}
.bottom-card-right {
  justify-content: flex-end;
  flex-wrap: wrap;
}

/* Meta Bar Area for Status & Version Strings */
.meta-status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 4px;
}
.status-bar {
  margin: 0;
  font-size: 14px;
  color: #aecbfa;
  white-space: nowrap;
  font-weight: bold;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
}
.app-version {
  font-size: 12px;
  color: #bdc1c6;
  white-space: nowrap;
}

/* Dedicated Portrait Header Container */
#roomHeaderCard {
  border: 1px solid #3c4043;
  border-radius: 10px;
  padding: 8px 8px;
  background: #303134;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Device Selector Pop-up Card styling */
.device-selector-card {
  display: none;
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: #202124;
  border: 1px solid #3c4043;
  border-radius: 12px;
  padding: 12px 12px 14px;
  z-index: 10;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  width: min(90vw, 500px);
}
.device-selector-card.active {
  display: flex;
}
.device-section {
  background: rgba(34, 36, 40, 0.96);
  border: 1px solid #3c4043;
  border-radius: 10px;
  padding: 12px 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.device-section-header {
  color: #f1f3f4;
  font-size: 24px;
  font-weight: 700;
  margin: 0;
  line-height: 1.2;
  letter-spacing: -0.02em;
}
.device-row {
  display: flex;
  align-items: center;
  width: 100%;
}
.device-row-inline {
  justify-content: flex-start;
}
.device-row-compact {
  margin-bottom: 4px;
}
.device-toggle-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 14px;
  margin: 2px 0 8px;
}
.device-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #dfe1e5;
  font-size: 13px;
  user-select: none;
}
.device-toggle input {
  accent-color: #1a73e8;
  margin: 0;
}
.device-select-wrap {
  position: relative;
  width: 100%;
}
.device-select-wrap-wide {
  flex: 1 1 auto;
  min-width: 0;
}
.device-select,
.device-advanced-select {
  width: 100%;
  max-width: 100%;
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid #5f6368;
  background: #202124;
  color: white;
  font-size: 14px;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
}
.device-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 12px;
  margin-top: 2px;
}
.device-grid-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.device-grid-item label {
  color: #e8eaed;
  font-size: 13px;
  line-height: 1.4;
}
.device-advanced-select {
  min-height: 42px;
}

/* Inputs & Buttons Base Layout */
input[type="text"] {
  padding: 10px 12px;
  border-radius: 4px;
  border: 1px solid #5f6368;
  background: #202124;
  color: white;
  font-size: 14px;
}
#roomKey {
  width: 180px;
  flex-shrink: 1;
  min-width: 100px;
}
.elapsed-time {
  width: 88px;
  min-width: 88px;
  height: 40px;
  border: 1px solid #5f6368;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  border-radius: 4px;
  background: #202124;
  color: #e8eaed;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}
button {
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  color: white;
  transition: background 0.2s;
  padding: 10px 14px;
  white-space: nowrap;
}
.btn-call,
.btn-control {
  width: 110px;
  min-width: 110px;
}

.btn-call { background: #1a73e8; }
.btn-call:hover { background: #1557b0; }
.btn-call-disconnect { background: #fbbc04; color: #202124; }
.btn-call-disconnect:hover { background: #f9ab00; }

.btn-control {
  font-size: 13px;
  text-align: center;
}
#muteBtn { background: #ea4335; }
#camBtn { background: #1a73e8; }
.btn-toggle-active {
  background: #34a853 !important;
  color: #202124;
}
.btn-settings-toggle {
  background: #3c4043;
  color: white;
  padding-bottom: 3px; /* Adjust vertical alignment for the arrow */
  width: 34px;
  height: 34px;
  font-size: 18px;
  display: inline-flex;
  align-items: flex-end; /* Vertically centers the arrow together with padding-bottom */
  justify-content: center;  /* Horizontally centers the arrow */
  line-height: 1;
}
.btn-settings-toggle:hover {
  background: #5f6368;
}
.pip-text {
  font-size: 13px;
  color: #bdc1c6;
}
.btn-pip {
  background: #3c4043;
  color: #e8eaed;
  width: 88px;
  min-width: 88px;
}
.btn-pip-active {
  background: #5f6368;
}
.btn-pip:disabled {
  opacity: 0.85;
  cursor: default;
}

/* Responsiveness Rules for Mid-Sized Viewports */
@media (max-width: 1130px) and (orientation: landscape) {
  .bottom-bar {
    justify-content: center;
  }
  .bottom-card {
    justify-content: center;
  }
}

/* Portrait Rules Modification Overrides */
@media (orientation: portrait) {
  .app-shell {
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 8px;
  }
  #roomHeaderCard {
    display: flex !important;
  }
  .video-stage {
    grid-row: 2;
  }
  .app-footer {
    grid-row: 3;
  }
  .bottom-bar {
    display: flex;
    flex-direction: column;
    padding: 4px 0;
    background: transparent;
    border: none;
    gap: 8px;
  }
  .bottom-card,
  #roomHeaderCard .bottom-card {
    width: 100%;
    justify-content: center;
  }

  .bottom-card-right {
    order: 1;
  }
  .bottom-card-center {
    order: 2;
  }
  
  /* No 'display: flex;' so the card stays hidden until [^] is clicked */
  .device-selector-card {
    position: static;
    transform: none;
    width: 100%;
    order: 3;
    box-shadow: none;
    padding: 12px 10px;
    flex-direction: column;
    gap: 8px;
  }
  
  /* Ensures the toggle engine can still force visibility when active */
  .device-selector-card.active {
    display: flex !important;
  }
  
  .device-row {
    display: flex !important;
    justify-content: flex-start;
    align-items: center;
    width: 100%;
    gap: 8px;
  }

  .device-select-wrap {
    display: block !important;
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 !important;
  }

  .device-select,
  .device-advanced-select {
    width: 100% !important;
    max-width: 100% !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
    overflow: hidden !important;
  }

  .device-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  
  .pip-text {
    display: none;
  }
  .meta-status-bar {
    display: none;
  }
  #roomHeaderCard .status-bar {
    text-align: center;
    width: 100%;
  }
  #roomHeaderCard .bottom-card {
    flex-wrap: nowrap !important; /* Prevents the call button from dropping down */
    gap: 8px; /* Slightly tighter spacing for small mobile screens */
    padding: 8px;
  }

  /* REMOVE THE 100% WIDTH AND FORCE AUTOMATIC SHRINKING */
  #roomHeaderCard #roomKey {
    width: 100% !important; /* Allows it to occupy remaining space */
    min-width: 80px !important; /* Safety floor: lets it shrink very small if needed */
    flex-shrink: 1 !important; /* Actively scales down on tight viewports */
  }  
}
</style>
</head>
<body>

<div class="app-shell">
  <div id="roomHeaderCard" style="display: none;"></div>

  <main class="video-stage">
    <div id="mainVideoHost" class="main-video-host">
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <div id="mainVideoLabel" class="video-label remote-label">Remote</div>
    
    <div id="pipCard" class="pip-card">
      <div id="pipVideoHost" class="pip-video-host">
        <video id="localVideo" autoplay playsinline muted></video>
      </div>
      <div id="pipVideoLabel" class="video-label">Local</div>
    </div>
  </main>

  <footer class="app-footer">
    <div id="deviceSelector" class="device-selector-card">
      <div class="device-section">
        <h3 class="device-section-header">Microphone</h3>

        <div class="device-row device-row-compact" style="justify-content: stretch;">
          <div class="device-select-wrap device-select-wrap-wide" style="width: 100%;">
            <select id="audioSource" class="device-select"></select>
          </div>
        </div>

        <div class="device-toggle-row">
          <label class="device-toggle"><input type="checkbox" checked> Echo Cancel</label>
          <label class="device-toggle"><input type="checkbox" checked> Noise Suppress</label>
          <label class="device-toggle"><input type="checkbox" checked> Auto Gain</label>
        </div>

        <div class="device-grid">
          <div class="device-grid-item">
            <label for="audioSampleRate">Samples (if supported)</label>
            <select id="audioSampleRate" class="device-advanced-select">
              <option selected>48000 Hz</option>
              <option>44100 Hz</option>
              <option>16000 Hz</option>
            </select>
          </div>

          <div class="device-grid-item">
            <label for="audioBitDepth">Bit Depth (if supported)</label>
            <select id="audioBitDepth" class="device-advanced-select">
              <option selected>16-bit</option>
              <option>24-bit</option>
            </select>
          </div>

          <div class="device-grid-item">
            <label for="audioChannels">Channels (if supported)</label>
            <select id="audioChannels" class="device-advanced-select">
              <option selected>Mono</option>
              <option>Stereo</option>
            </select>
          </div>

          <div class="device-grid-item">
            <label for="audioBitrateCeiling">Bitrate Ceiling</label>
            <select id="audioBitrateCeiling" class="device-advanced-select">
              <option selected>256 kbps</option>
              <option>128 kbps</option>
              <option>64 kbps</option>
            </select>
          </div>
        </div>
      </div>

      <div class="device-section">
        <h3 class="device-section-header">Camera &amp; Transport</h3>

        <div class="device-row device-row-compact" style="justify-content: stretch;">
          <div class="device-select-wrap device-select-wrap-wide" style="width: 100%;">
            <select id="videoSource" class="device-select"></select>
          </div>
        </div>

        <div class="device-grid">
          <div class="device-grid-item">
            <label for="videoResolution">Resolution</label>
            <select id="videoResolution" class="device-advanced-select">
              <option>360p</option>
              <option selected>720p</option>
              <option>1080p</option>
            </select>
          </div>

          <div class="device-grid-item">
            <label for="videoFps">Max FPS (Network)</label>
            <select id="videoFps" class="device-advanced-select">
              <option>60 FPS</option>
              <option selected>30 FPS</option>
              <option>15 FPS</option>
            </select>
          </div>

          <div class="device-grid-item">
            <label for="videoDegradation">Degradation</label>
            <select id="videoDegradation" class="device-advanced-select">
              <option selected>Maintain FPS</option>
              <option>Maintain Resolution</option>
              <option>Balanced Mode</option>
            </select>
          </div>

          <div class="device-grid-item">
            <label for="videoBitrateCeiling">Bitrate Ceiling</label>
            <select id="videoBitrateCeiling" class="device-advanced-select">
              <option>4000 kbps</option>
              <option selected>2000 kbps</option>
              <option>500 kbps</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div id="connectionControlsCard" class="bottom-card bottom-card-left">
        <span id="elapsedTime" class="elapsed-time" title="Elapsed time">0:00:00</span>
        <input type="text" id="roomKey" placeholder="e.g., hristo-room" autocomplete="off">
        <button id="callBtn" class="btn-call" title="Call or End (Q)">Call</button>
      </div>

      <div class="bottom-card bottom-card-center">
        <button id="muteBtn" class="btn-control" data-muted="false" title="Mute toggle (Space)">Mute</button>
        <button id="camBtn" class="btn-control" data-off="false" title="Camera toggle (C)">Camera off</button>
        <button id="settingsToggleBtn" class="btn-settings-toggle" type="button" title="Toggle Hardware Selectors" aria-label="Toggle hardware selectors">⌃</button>
      </div>

      <div class="bottom-card bottom-card-right">
        <span class="pip-text">PiP:</span>
        <button id="moveBtn" class="btn-control btn-pip" type="button" title="Move PiP (M)" disabled>Move</button>
        <button id="swapBtn" class="btn-control btn-pip" type="button" title="Swap main/PiP (X)" disabled>Swap</button>
        <button id="sizeBtn" class="btn-control btn-pip" type="button" title="Cycle PiP size (V)" disabled>Size</button>
      </div>
    </div>

    <div class="meta-status-bar">
      <div id="statusText" class="status-bar">Camera active. Enter a key above to connect.</div>
      <span id="appVersion" class="app-version">vX.X.XX</span>
    </div>
  </footer>
</div>

<!-- Load the diagnostic tool first -->
<script src="WebRTCDebugger.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
