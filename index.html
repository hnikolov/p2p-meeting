<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Meeting via Secret Key</title>
    <link rel="icon" href="data:,">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #202124; color: white; margin: 0; padding: 20px; }
        .setup-panel { background: #303134; padding: 20px; border-radius: 8px; margin-bottom: 20px; width: 100%; max-width: 500px; box-sizing: border-box; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        input { padding: 12px; border-radius: 4px; border: 1px solid #5f6368; background: #202124; color: white; font-size: 16px; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; color: white; transition: background 0.2s; }
        .btn-start { background: #1a73e8; }
        .btn-start:hover { background: #1557b0; }
        .btn-join { background: #12b886; }
        .btn-join:hover { background: #0ca678; }
        .controls-row { display: flex; gap: 15px; margin-top: 20px; justify-content: center; width: 100%; }
        .btn-control { max-width: 160px; font-size: 13px; }
        #muteBtn { background: #ea4335; }
        #camBtn { background: #1a73e8; }
        
        .status-bar { margin: 10px 0; font-size: 14px; color: #aecbfa; font-weight: bold; }
        .video-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .video-box { position: relative; }
        video { width: 45vw; max-width: 480px; min-width: 280px; height: 320px; background: #000; border-radius: 8px; transform: scaleX(-1); object-fit: cover; border: 2px solid #3c4043; }
        #remoteVideo { transform: none; }
        .video-label { position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

    <h1>P2P Serverless Meeting</h1>
    
    <!-- Unified Setup Control Panel -->
    <div class="setup-panel">
        <div class="input-group">
            <label for="roomKey">Enter Shared Secret Key:</label>
            <input type="text" id="roomKey" placeholder="e.g., hristo-room" autocomplete="off">
        </div>
        <div class="btn-group">
            <button id="startBtn" class="btn-start">Start a New Call</button>
            <button id="joinBtn" class="btn-join">Join Existing Call</button>
        </div>
    </div>

    <div id="statusText" class="status-bar">Camera active. Enter a key above to connect.</div>

    <div class="input-group">
        <label for="audioSource">Microphone:</label>
        <select id="audioSource"></select>
    </div>
    <div class="input-group">
        <label for="videoSource">Camera:</label>
        <select id="videoSource"></select>
    </div>

    <div class="video-container">
        <div class="video-box">
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="video-label">You (Local)</div>
        </div>
        <div class="video-box">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="video-label">Friend (Remote)</div>
        </div>
    </div>

    <!-- Media Controls Row -->
    <div class="controls-row">
        <button id="muteBtn" class="btn-control" data-muted="false">Mute Audio</button>
        <button id="camBtn" class="btn-control" data-off="false">Turn Camera Off</button>
    </div>

    <!-- Offline-Safe Script Routing -->
    <script type="module">
        //*
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, set, onChildAdded, remove } from "https://gstatic.com";
        /*/
        import { initializeApp } from "./firebase-app.js";
        import { getDatabase, ref, set, onChildAdded, remove } from "./firebase-database.js";
        //*/
        
        // Replace with your actual Firebase project configuration parameters here
        const firebaseConfig = {
            apiKey: "AIzaSyB2F_QfZFAwitJrFEcvCTadOsLOVETkRpg",
            authDomain: "p2p-meeting-c4e09.firebaseapp.com",
            databaseURL: "https://console.firebase.google.com/project/p2p-meeting-c4e09/database/p2p-meeting-c4e09-default-rtdb/data/~2F",
            projectId: "p2p-meeting-c4e09",
            storageBucket: "p2p-meeting-c4e09.firebasestorage.app",
            messagingSenderId: "977559758143",
            appId: "1:977559758143:web:014c42c579988a25555f8a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let localStream;
        let peerConnection;
        let activeRoomName = null;

        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }]
        };

        const roomKeyInput = document.getElementById('roomKey');
        const startBtn = document.getElementById('startBtn');
        const joinBtn = document.getElementById('joinBtn');
        const muteBtn = document.getElementById('muteBtn');
        const camBtn = document.getElementById('camBtn');
        const statusText = document.getElementById('statusText');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');

        async function discoverDevices() {
            const audioSelect = document.getElementById('audioSource');
            const videoSelect = document.getElementById('videoSource');
            
            // Fetch all connected audio and video hardware
            const devices = await navigator.mediaDevices.enumerateDevices();
            
            // Clear existing options
            audioSelect.innerHTML = '';
            videoSelect.innerHTML = '';

            devices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.deviceId;

                if (device.kind === 'audioinput') {
                    option.text = device.label || `Microphone ${audioSelect.length + 1}`;
                    audioSelect.appendChild(option);
                } else if (device.kind === 'videoinput') {
                    option.text = device.label || `Camera ${videoSelect.length + 1}`;
                    videoSelect.appendChild(option);
                }
            });
        }

        // Step 1: Open Local Hardware Feed
        async function init() {
            try {
                // Optimized media constraints for maximum audio stability
                const constraints = { 
                    video: {
                        width: { ideal: 640, max: 640 },
                        height: { ideal: 480, max: 480 },
                        frameRate: { ideal: 15, max: 15 } // Cuts video data transmission in half
                    }, 
                    audio: {
                        echoCancellation: true, // Prevents feedback loops
                        noiseSuppression: true, // Filters background hums
                        autoGainControl: true // Prevents clipping if you speak too loudly
                    }
                };

                // Request hardware access first (triggers browser permission pop-up)
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localVideo.srcObject = localStream;

                // Scan the available hardware and populate your dropdown menus
                await discoverDevices();
            } catch (err) {
                statusText.innerText = "Error: System camera/microphone access denied.";
                console.error(err);
            }
        }

        // Step 2: Build WebRTC Engine Isolated Inside the Secret Room Node
        function createPeerConnection(roomName) {
            peerConnection = new RTCPeerConnection(rtcConfig);

            // 1. Add the Audio Track with MAX Priority
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                peerConnection.addTransceiver(audioTrack, {
                    direction: "sendrecv",
                    streams: [localStream],
                    sendEncodings: [
                        { priority: "very-high" } // Tells the browser router never to drop audio
                    ]
                });
            }

            // 2. Add the Video Track with Low Priority & Degradation Preferences
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                const videoTransceiver = peerConnection.addTransceiver(videoTrack, {
                    direction: "sendrecv",
                    streams: [localStream],
                    sendEncodings: [
                        { 
                            priority: "low",
                            maxBitrate: 400000 // Hard-caps video upload to ~400kbps (Prevents choking)
                        }
                    ]
                });

                // Tells WebRTC: If the network chokes, lower the image resolution, but KEEP the audio and video moving smoothly
                const sender = videoTransceiver.sender;
                const parameters = sender.getParameters();
                parameters.degradationPreference = "maintain-framerate";
                sender.setParameters(parameters).catch(err => console.error("Degradation error:", err));
            }

            peerConnection.ontrack = (event) => {
                if (!remoteVideo.srcObject) {
                    remoteVideo.srcObject = event.streams[0];
                    statusText.innerText = "Connected! Peer media stream verified.";
                }
            };

            // Write local network candidates straight to Firebase
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    const candidateId = `candidate_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
                    const candRef = ref(db, `rooms/${roomName}/${candidateId}`);
                    set(candRef, { candidate: event.candidate.toJSON() });
                }
            };
        }

        // Alphanumeric character validator
        function getValidatedKey() {
            const key = roomKeyInput.value.trim().replace(/[^a-zA-Z0-9-_]/g, '');
            if (!key) {
                alert("Please enter a valid alphanumeric key.");
                return null;
            }
            return key;
        }

        // Action A: Host starts the call session
        startBtn.addEventListener('click', async () => {
            const roomName = getValidatedKey();
            if (!roomName) return;

            startBtn.disabled = true;
            joinBtn.disabled = true;
            activeRoomName = roomName;
            statusText.innerText = `Initializing room "${roomName}"...`;

            // Flush out lingering historical database records for a fresh connection
            const roomRef = ref(db, `rooms/${roomName}`);
            await remove(roomRef);

            createPeerConnection(roomName);

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            // Write the local connection configurations to the secret database cluster
            const sdpRef = ref(db, `rooms/${roomName}/sdp`);
            await set(sdpRef, { sdp: { type: offer.type, sdp: offer.sdp } });

            statusText.innerText = `Room "${roomName}" created. Waiting for friend to join...`;
            listenToRoom(roomName);
        });

        // Action B: Client joins the call session
        joinBtn.addEventListener('click', () => {
            const roomName = getValidatedKey();
            if (!roomName) return;

            startBtn.disabled = true;
            joinBtn.disabled = true;
            activeRoomName = roomName;
            statusText.innerText = `Connecting to room "${roomName}"...`;

            createPeerConnection(roomName);
            listenToRoom(roomName);
        });

        // Step 3: Event Sync Engine mapped to the shared room tree
        function listenToRoom(roomName) {
            const targetRef = ref(db, `rooms/${roomName}`);
            
            onChildAdded(targetRef, async (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                if (data.sdp) {
                    // Stop configurations looping if it matches what we sent
                    if (peerConnection.localDescription && peerConnection.localDescription.sdp === data.sdp.sdp) return;

                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));

                    // If a client receives an offer packet, automatically synthesize an answer response
                    if (data.sdp.type === 'offer') {
                        statusText.innerText = "Processing call invitation...";
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);

                        const sdpRef = ref(db, `rooms/${roomName}/sdp`);
                        await set(sdpRef, { sdp: { type: answer.type, sdp: answer.sdp } });
                        statusText.innerText = "Answer transmitted. Syncing streams...";
                    }
                } 
                else if (data.candidate) {
                    try {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    } catch (e) {
                        console.warn("ICE candidate skipped:", e);
                    }
                }
            });
        }

        // Hardware Controls: Audio Mute Switch
        muteBtn.addEventListener('click', () => {
            const audioTracks = localStream.getAudioTracks();
            if (audioTracks.length > 0) {
                const isMuted = muteBtn.getAttribute('data-muted') === 'true';
                audioTracks[0].enabled = isMuted; // Toggle transmission states
                muteBtn.setAttribute('data-muted', !isMuted);
                muteBtn.innerText = isMuted ? "Mute Audio" : "Unmute Audio";
                muteBtn.style.background = isMuted ? "#ea4335" : "#34a853";
            }
        });

        // Hardware Controls: Camera On/Off Toggle
        camBtn.addEventListener('click', () => {
            const videoTracks = localStream.getVideoTracks();
            if (videoTracks.length > 0) {
                const isCamOff = camBtn.getAttribute('data-off') === 'true';
                videoTracks[0].enabled = isCamOff; // Toggle transmission states
                camBtn.setAttribute('data-off', !isCamOff);
                camBtn.innerText = isCamOff ? "Turn Camera Off" : "Turn Camera On";
                camBtn.style.background = isCamOff ? "#1a73e8" : "#ea4335";
            }
        });

        // Seamless Video Camera Switcher
        document.getElementById('videoSource').addEventListener('change', async (event) => {
            const videoDeviceId = event.target.value;
            if (!videoDeviceId) return;

            try {
                // Capture new camera using your lightweight bandwidth constraints
                const newStream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        deviceId: { exact: videoDeviceId }, 
                        width: { ideal: 640, max: 640 }, 
                        height: { ideal: 480, max: 480 }, 
                        frameRate: { ideal: 15, max: 15 } 
                    }
                });
                
                const newVideoTrack = newStream.getVideoTracks()[0];
                const oldVideoTrack = localStream.getVideoTracks()[0];

                // Swap the track in your local camera preview window
                localStream.removeTrack(oldVideoTrack);
                oldVideoTrack.stop(); // Turn off the old camera hardware to save battery
                localStream.addTrack(newVideoTrack);
                localVideo.srcObject = localStream;

                // Seamlessly hot-swap the video track across the live connection to your friend
                if (peerConnection) {
                    const senders = peerConnection.getSenders();
                    const videoSender = senders.find(s => s.track && s.track.kind === 'video');
                    if (videoSender) {
                        await videoSender.replaceTrack(newVideoTrack);
                    }
                }
            } catch (err) {
                console.error("Failed to switch camera source:", err);
                alert("Could not switch to the selected camera hardware.");
            }
        });

        // Seamless Microphone Switcher
        document.getElementById('audioSource').addEventListener('change', async (event) => {
            const audioDeviceId = event.target.value;
            if (!audioDeviceId) return;

            try {
                // Capture new microphone using your echo/noise audio filters
                const newStream = await navigator.mediaDevices.getUserMedia({
                    audio: { 
                        deviceId: { exact: audioDeviceId },
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                
                const newAudioTrack = newStream.getAudioTracks()[0];
                const oldAudioTrack = localStream.getAudioTracks()[0];

                // If your mute button is currently active, ensure the new track matches that state
                const isCurrentlyMuted = document.getElementById('muteBtn').getAttribute('data-muted') === 'true';
                newAudioTrack.enabled = !isCurrentlyMuted;

                // Swap the track in your local processing memory
                localStream.removeTrack(oldAudioTrack);
                oldAudioTrack.stop(); // Shut down old microphone hardware processing
                localStream.addTrack(newAudioTrack);

                // Seamlessly hot-swap the audio track across the live connection to your friend
                if (peerConnection) {
                    const senders = peerConnection.getSenders();
                    const audioSender = senders.find(s => s.track && s.track.kind === 'audio');
                    if (audioSender) {
                        await audioSender.replaceTrack(newAudioTrack);
                    }
                }
            } catch (err) {
                console.error("Failed to switch microphone source:", err);
                alert("Could not switch to the selected microphone hardware.");
            }
        });

        // Step 4: Automatic Room Clean-up Execution
        // Triggers instantly when a participant exits the page or closes the browser tab
        window.addEventListener('beforeunload', () => {
            if (activeRoomName) {
                const roomRef = ref(db, `rooms/${activeRoomName}`);
                remove(roomRef);
            }
        });

        window.onload = init;
    </script>
</body>
</html>
