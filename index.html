<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Serverless P2P Video Call</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #202124; color: white; margin: 0; padding: 20px; }
        .video-container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
        video { width: 45vw; max-width: 500px; min-width: 300px; height: 350px; background: #000; border-radius: 8px; transform: scaleX(-1); object-fit: cover; }
        #remoteVideo { transform: none; }
        .controls { margin-top: 20px; display: flex; gap: 10px; }
        button { padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        #startBtn { background: #1a73e8; color: white; }
        #muteBtn { background: #ea4335; color: white; }
    </style>
</head>
<body>

    <h1>2-Person Serverless Meeting</h1>
    
    <div class="video-container">
        <div>
            <h3>Local (You)</h3>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div>
            <h3>Remote (Friend)</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <div class="controls">
        <button id="startBtn">Start Call</button>
        <button id="muteBtn" data-muted="false">Mute Audio</button>
    </div>

    <!-- Firebase JS SDK Modules -->
    <script type="module">
        // Change your imports to look exactly like this:
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, set, onChildAdded, remove } from "https://gstatic.com";


        // TODO: Replace with your actual Firebase project configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB2F_QfZFAwitJrFEcvCTadOsLOVETkRpg",
            authDomain: "p2p-meeting-c4e09.firebaseapp.com",
            databaseURL: "https://console.firebase.google.com/project/p2p-meeting-c4e09/database/p2p-meeting-c4e09-default-rtdb/data/~2F",
            projectId: "p2p-meeting-c4e09",
            storageBucket: "p2p-meeting-c4e09.firebasestorage.app",
            messagingSenderId: "977559758143",
            appId: "1:977559758143:web:014c42c579988a25555f8a"
        };
  
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const signalRef = ref(db, 'signaling');

        let localStream;
        let peerConnection;

        const rtcConfig = {
            iceServers: [{ urls: 'stun:://google.com' }, { urls: 'stun:://google.com' }]
        };

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const startBtn = document.getElementById('startBtn');
        const muteBtn = document.getElementById('muteBtn');

        // Step 1: Capture camera & microphone immediately
        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                // Clear any leftover database signaling data from previous calls
                await remove(signalRef);
            } catch (err) {
                console.error("Camera access denied:", err);
                alert("Camera and microphone access are required.");
            }
        }

        // Step 2: Establish the WebRTC Connection
        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = (event) => {
                if (!remoteVideo.srcObject) {
                    remoteVideo.srcObject = event.streams[0];
                }
            };

            // Write generated ICE candidates to Firebase database
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    const newCandidateRef = ref(db, `signaling/candidate_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`);
                    set(newCandidateRef, { candidate: event.candidate.toJSON() });
                }
            };
        }

        // Step 3: Peer A pushes "Call Offer" to Firebase
        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            startBtn.innerText = "Connecting...";
            createPeerConnection();
            
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            
            // Save local SDP to Firebase
            const sdpRef = ref(db, 'signaling/sdp');
            await set(sdpRef, { sdp: { type: offer.type, sdp: offer.sdp } });
        });

        // Step 4: Listen to Firebase for updates
        onChildAdded(signalRef, async (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            if (!peerConnection) {
                createPeerConnection();
            }

            // Process incoming session configurations (SDP Offers / Answers)
            if (data.sdp) {
                // Skip if it matches our own description to avoid infinite loops
                if (peerConnection.localDescription && peerConnection.localDescription.sdp === data.sdp.sdp) return;

                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                
                // If Peer B receives an offer, auto-generate and push back an Answer
                if (data.sdp.type === 'offer') {
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    
                    const sdpRef = ref(db, 'signaling/sdp');
                    await set(sdpRef, { sdp: { type: answer.type, sdp: answer.sdp } });
                }
            } 
            // Process incoming ICE network paths
            else if (data.candidate) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                } catch (e) {
                    console.error("Error adding network candidate:", e);
                }
            }
        });

        // Audio controls
        muteBtn.addEventListener('click', () => {
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                const isMuted = muteBtn.getAttribute('data-muted') === 'true';
                audioTrack.enabled = isMuted;
                muteBtn.setAttribute('data-muted', !isMuted);
                muteBtn.innerText = isMuted ? "Mute Audio" : "Unmute Audio";
                muteBtn.style.background = isMuted ? "#ea4335" : "#34a853";
            }
        });

        window.onload = init;
    </script>
</body>
</html>
