<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#202124">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="P2P Meeting">
<title>P2P Meeting via Secret Key</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --app-vh: 100dvh;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --pip-btn-width: 80px;
  --main-btn-width: 94px;

  /* TUNING VARIABLES */
  --select-width-ls: 320px; /* Dropdown width for Landscape */
}
* {
  box-sizing: border-box;
}
body {
  font-family: sans-serif;
  background: #202124;
  color: white;
  margin: 0;
  padding: calc(12px + var(--safe-top)) calc(12px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(12px + var(--safe-left));
  height: var(--app-vh);
  min-height: var(--app-vh);
  overflow: hidden;
}
.app-shell {
  width: 100%;
  max-width: 1300px;
  margin: 0 auto;
  height: 100%;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 10px;
}
.video-stage {
  position: relative;
  width: 100%;
  min-height: 0;
  height: 100%;
  background: #000;
  border: 2px solid #3c4043;
  border-radius: 10px;
  overflow: hidden;
}
.main-video-host {
  width: 100%;
  height: 100%;
}
.main-video-host video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}
#remoteVideo {
  transform: none;
}
.pip-card {
  position: absolute;
  right: 16px;
  bottom: 16px;
  width: min(24vw, 320px);
  min-width: 190px;
  aspect-ratio: 4 / 3;
  border: 2px solid #3c4043;
  border-radius: 8px;
  overflow: hidden;
  background: #000;
  transition: top 0.18s ease, right 0.18s ease, bottom 0.18s ease, left 0.18s ease, transform 0.18s ease, width 0.18s ease;
}
.pip-video-host {
  width: 100%;
  height: 100%;
}
.pip-video-host video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}
#localVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
  background: #000;
}
.video-label {
  position: absolute;
  bottom: 10px;
  left: 10px;
  background: rgba(0,0,0,0.6);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 12px;
}
.remote-label {
  z-index: 2;
}

/* Consolidated Controls Footer Area */
.app-footer {
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}
.bottom-bar {
  background: #303134;
  border: 1px solid #3c4043;
  border-radius: 10px;
  padding: 8px 12px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  min-height: 52px;
}
.bottom-card {
  border: 1px solid #3c4043;
  border-radius: 8px;
  padding: 8px 10px;
  background: #202124;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.bottom-card-left {
  justify-content: flex-start;
}
.bottom-card-center {
  justify-content: center;
}
.bottom-card-right {
  justify-content: flex-end;
  flex-wrap: wrap;
}

/* Meta Bar Area for Status & Version Strings */
.meta-status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 4px;
}
.status-bar {
  margin: 0;
  font-size: 14px;
  color: #aecbfa;
  white-space: nowrap;
  font-weight: bold;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
}
.app-version {
  font-size: 12px;
  color: #bdc1c6;
  white-space: nowrap;
}

/* Dedicated Portrait Header Container */
#roomHeaderCard {
  border: 1px solid #3c4043;
  border-radius: 10px;
  padding: 10px 12px;
  background: #303134;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
#roomHeaderCard .bottom-card {
  width: 100%;
  justify-content: center;
}

/* Device Selector Pop-up Card styling */
.device-selector-card {
  display: none;
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: #202124;
  border: 1px solid #3c4043;
  border-radius: 8px;
  padding: 12px 16px;
  z-index: 10;
  flex-direction: column;
  gap: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}
.device-selector-card.active {
  display: flex;
}
.device-row {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  width: 100%;
}
.device-label {
  color: #bdc1c6;
  white-space: nowrap;
  font-size: 13px;
  width: 42px;
  text-align: right;
}
.profile-low-toggle {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: #bdc1c6;
  font-size: 13px;
  white-space: nowrap;
  user-select: none;
}
.profile-low-toggle input {
  margin: 0;
  accent-color: #1a73e8;
}
.device-select-wrap {
  position: relative;
}
.device-select {
  padding: 10px 12px;
  border-radius: 4px;
  border: 1px solid #5f6368;
  background: #202124;
  color: white;
  font-size: 14px;
  width: var(--select-width-ls);
  max-width: var(--select-width-ls);
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
}

/* Inputs & Buttons Base Layout */
input[type="text"] {
  padding: 10px 12px;
  border-radius: 4px;
  border: 1px solid #5f6368;
  background: #202124;
  color: white;
  font-size: 14px;
}
#roomKey {
  width: 180px;
  flex-shrink: 1;
  min-width: 100px;
}
.elapsed-time {
  width: 88px;
  min-width: 88px;
  height: 40px;
  border: 1px solid #5f6368;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  border-radius: 4px;
  background: #202124;
  color: #e8eaed;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}
button {
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  color: white;
  transition: background 0.2s;
  padding: 10px 14px;
  white-space: nowrap;
}
#callBtn {
  width: 110px;
  min-width: 110px;
}
.btn-call { background: #1a73e8; }
.btn-call:hover { background: #1557b0; }
.btn-call-disconnect { background: #fbbc04; color: #202124; }
.btn-call-disconnect:hover { background: #f9ab00; }

.btn-control {
  width: 110px;
  min-width: 110px;
  font-size: 13px;
  text-align: center;
}
#muteBtn { background: #ea4335; }
#camBtn { background: #1a73e8; }
.btn-toggle-active {
  background: #34a853 !important;
  color: #202124;
}
.btn-settings-toggle {
  background: #3c4043;
  color: white;
  padding-bottom: 3px; /* Adjust vertical alignment for the arrow */
  width: 34px;
  height: 34px;
  font-size: 18px;
  display: inline-flex;
  align-items: flex-end; /* Vertically centers the arrow together with padding-bottom */
  justify-content: center;  /* Horizontally centers the arrow */
  line-height: 1;
}
.btn-settings-toggle:hover {
  background: #5f6368;
}
.pip-text {
  font-size: 13px;
  color: #bdc1c6;
}
.btn-pip {
  background: #3c4043;
  color: #e8eaed;
  width: 88px;
  min-width: 88px;
}
.btn-pip-active {
  background: #5f6368;
}
.btn-pip:disabled {
  opacity: 0.85;
  cursor: default;
}

/* Responsiveness Rules for Mid-Sized Viewports */
@media (max-width: 1100px) and (orientation: landscape) {
  .bottom-bar {
    justify-content: center;
  }
  .bottom-card {
    flex-grow: 1;
    justify-content: center;
  }
}

@media (max-width: 980px) and (orientation: landscape) {
  .bottom-bar {
    gap: 8px;
  }
  #roomKey {
    width: 100%;
  }
}

/* Portrait Rules Modification Overrides */
@media (orientation: portrait) {
  .app-shell {
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 8px;
  }
  #roomHeaderCard {
    display: flex !important;
  }
  .video-stage {
    grid-row: 2;
  }
  .app-footer {
    grid-row: 3;
  }
  .bottom-bar {
    display: flex;
    flex-direction: column;
    padding: 4px 0;
    background: transparent;
    border: none;
    gap: 8px;
  }
  .bottom-card {
    width: 100%;
    justify-content: center;
  }
  .bottom-card-right {
    order: 1;
  }
  .bottom-card-center {
    order: 2;
  }
  
  /* Removed 'display: flex;' so the card stays hidden until [^] is clicked */
  .device-selector-card {
    position: static;
    transform: none;
    width: 100%;
    order: 3;
    box-shadow: none;
    padding: 12px 10px;
    flex-direction: column;
    gap: 8px;
  }
  
  /* Ensures the toggle engine can still force visibility when active */
  .device-selector-card.active {
    display: flex !important;
  }
  
  /* Align everything to the right side of the row by default */
  .device-row {
    display: flex !important;
    justify-content: flex-end; 
    align-items: center;
    width: 100%;
    gap: 0;
  }
  
  /* This forces the checkbox to the left, leaving the rest grouped on the right */
  .profile-low-toggle {
    margin-right: auto !important; 
    display: inline-flex;
    align-items: center;
  }
  
  /* Positioned directly next to the select boxes with a small gap */
  .device-label {
    display: inline-block !important;
    width: auto !important;
    min-width: 0 !important;
    text-align: right !important;
    margin: 0 !important;
    padding-right: 8px !important;
    color: #bdc1c6;
    font-size: 13px;
    white-space: nowrap;
  }

  /* Anchors the select wrapper right against the label */
  .device-select-wrap {
    display: block !important;
    width: 220px !important;
    margin: 0 !important;
  }

  /* Locks size and forces text truncation in Portrait orientation */
  .device-select {
    width: 220px !important;       
    max-width: 220px !important;   
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
    overflow: hidden !important;
  }
  
  .pip-text {
    display: none;
  }
  .meta-status-bar {
    display: none;
  }
  #roomHeaderCard .status-bar {
    text-align: center;
    width: 100%;
  }
}
</style>
</head>
<body>

<div class="app-shell">
  <div id="roomHeaderCard" style="display: none;"></div>

  <main class="video-stage">
    <div id="mainVideoHost" class="main-video-host">
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <div id="mainVideoLabel" class="video-label remote-label">Remote</div>
    
    <div id="pipCard" class="pip-card">
      <div id="pipVideoHost" class="pip-video-host">
        <video id="localVideo" autoplay playsinline muted></video>
      </div>
      <div id="pipVideoLabel" class="video-label">Local</div>
    </div>
  </main>

  <footer class="app-footer">
    <div id="deviceSelector" class="device-selector-card">

        <input type="text" id="roomKey" placeholder="e.g., hristo-room" autocomplete="off">
        <button id="callBtn" class="btn-call" title="Call or End (Q)">Call</button>
      </div>

      <div class="bottom-card bottom-card-center">
        <button id="muteBtn" class="btn-control" data-muted="false" title="Mute toggle (Space)">Mute</button>
        <button id="camBtn" class="btn-control" data-off="false" title="Camera toggle (C)">Camera off</button>
        <button id="settingsToggleBtn" class="btn-settings-toggle" type="button" title="Toggle Hardware Selectors" aria-label="Toggle hardware selectors">⌃</button>
      </div>

      <div class="bottom-card bottom-card-right">
        <span class="pip-text">PiP:</span>
        <button id="moveBtn" class="btn-control btn-pip" type="button" title="Move PiP (M)" disabled>Move</button>
        <button id="swapBtn" class="btn-control btn-pip" type="button" title="Swap main/PiP (X)" disabled>Swap</button>
        <button id="sizeBtn" class="btn-control btn-pip" type="button" title="Cycle PiP size (V)" disabled>Size</button>
      </div>
    </div>

    <div class="meta-status-bar">
      <div id="statusText" class="status-bar">Camera active. Enter a key above to connect.</div>
      <span id="appVersion" class="app-version">vX.X.XX</span>
    </div>
  </footer>
</div>

<script type="module">
  const settingsToggle = document.getElementById('settingsToggleBtn');
  const deviceSelector = document.getElementById('deviceSelector');
  
  settingsToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    deviceSelector.classList.toggle('active');
  });

  document.addEventListener('click', (e) => {
    if (!deviceSelector.contains(e.target) && e.target !== settingsToggle) {
      deviceSelector.classList.remove('active');
    }
  });

  function handleMediaLayoutChange() {
    const isPortrait = window.matchMedia("(orientation: portrait)").matches;
    const connectionCard = document.getElementById('connectionControlsCard');
    const portraitHeaderTarget = document.getElementById('roomHeaderCard');
    const bottomBar = document.querySelector('.bottom-bar');
    const statusText = document.getElementById('statusText');
    const metaStatusBar = document.querySelector('.meta-status-bar');

    if (isPortrait) {
      if (connectionCard.parentElement !== portraitHeaderTarget) {
        portraitHeaderTarget.appendChild(connectionCard);
        portraitHeaderTarget.appendChild(statusText);
      }
    } else {
      if (connectionCard.parentElement !== bottomBar) {
        bottomBar.insertBefore(connectionCard, bottomBar.firstChild);
        metaStatusBar.insertBefore(statusText, metaStatusBar.firstChild);
      }
    }
  }

  window.addEventListener('resize', handleMediaLayoutChange);
  window.addEventListener('orientationchange', handleMediaLayoutChange);
  document.addEventListener('DOMContentLoaded', handleMediaLayoutChange);

    // Offline-Safe Script Routing

        // Replace with your actual Firebase project configuration parameters here
        const firebaseConfig = {

            storageBucket: "p2p-meeting-c4e09.firebasestorage.app",
            messagingSenderId: "977559758143",
            appId: "1:977559758143:web:014c42c579988a25555f8a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let localStream;
        let remoteStream = null;

        let activeSessionId = null;
        let remotePresenceSeen = false;

        let joinTimeoutId = null;

        const rtcConfig = {

                { urls: 'stun:stun.l.google.com:19302' },

            ],
            // Let the browser use host/srflx/relay based on network reachability.
            iceTransportPolicy: 'all'
        };

        const roomKeyInput = document.getElementById('roomKey');
        const callBtn = document.getElementById('callBtn');
        const muteBtn = document.getElementById('muteBtn');
        const camBtn = document.getElementById('camBtn');
        const statusText = document.getElementById('statusText');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const mainVideoHost = document.getElementById('mainVideoHost');
        const pipVideoHost = document.getElementById('pipVideoHost');
        const mainVideoLabel = document.getElementById('mainVideoLabel');
        const pipVideoLabel = document.getElementById('pipVideoLabel');
        const pipCard = document.getElementById('pipCard');
        const audioSource = document.getElementById('audioSource');
        const videoSource = document.getElementById('videoSource');
        const audioProfileLowToggle = document.getElementById('audioProfileLow');

        const moveBtn = document.getElementById('moveBtn');

        const sizeBtn = document.getElementById('sizeBtn');
        const appVersionText = document.getElementById('appVersion');
        const elapsedTimeText = document.getElementById('elapsedTime');

        const APP_VERSION = 'v0.2.13';

        const ROOM_KEY_STORAGE_KEY = 'p2p-meeting:last-room-key';
        const PIP_LAYOUT_STORAGE_KEY = 'p2p-meeting:pip-layout-v1';
        const AUDIO_BITRATE_SPEECH_BPS = 32000;
        const AUDIO_BITRATE_MUSIC_BPS = 256000;

        const KEYBOARD_SHORTCUTS = {
            call: 'q',
            mute: 'space',
            camera: 'c',
            move: 'm',
            swap: 'x',
            size: 'v'
        };

        const DEVICE_SELECT_REFOCUS_GUARD_MS = 150;

        const PIP_POSITIONS = [
            { key: 'top-right', top: '16px', right: '16px', bottom: 'auto', left: 'auto', transform: 'none' },
            { key: 'top-center', top: '16px', right: 'auto', bottom: 'auto', left: '50%', transform: 'translateX(-50%)' },
            { key: 'top-left', top: '16px', right: 'auto', bottom: 'auto', left: '16px', transform: 'none' },
            { key: 'bottom-left', top: 'auto', right: 'auto', bottom: '16px', left: '16px', transform: 'none' },
            { key: 'bottom-center', top: 'auto', right: 'auto', bottom: '16px', left: '50%', transform: 'translateX(-50%)' },
            { key: 'bottom-right', top: 'auto', right: '16px', bottom: '16px', left: 'auto', transform: 'none' }
        ];

        const PIP_SIZES = [
            { key: 'small', width: 'min(20vw, 240px)', minWidth: '140px' },
            { key: 'medium', width: 'min(24vw, 320px)', minWidth: '190px' },
            { key: 'large', width: 'min(30vw, 400px)', minWidth: '220px' }
        ];

        const pipViewState = {
            positionIndex: PIP_POSITIONS.length - 1,
            sizeIndex: 1,
            mainView: 'remote'
        };

        const deviceSelectUiState = {
            audioOpenedAt: 0,
            videoOpenedAt: 0
        };

        let viewportMetricsRafId = 0;
        let elapsedTimerId = 0;
        let elapsedTimerStartedAt = 0;

        function formatElapsedTime(ms) {
            const totalSeconds = Math.max(0, Math.floor(ms / 1000));
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function setElapsedTimeMs(ms) {
            if (!elapsedTimeText) return;
            elapsedTimeText.innerText = formatElapsedTime(ms);
        }

        function startElapsedTimer({ reset = false } = {}) {
            if (reset) {
                elapsedTimerStartedAt = Date.now();
                setElapsedTimeMs(0);
            } else if (!elapsedTimerStartedAt) {
                elapsedTimerStartedAt = Date.now();
            }

            if (elapsedTimerId) {
                clearInterval(elapsedTimerId);
            }

            elapsedTimerId = setInterval(() => {
                setElapsedTimeMs(Date.now() - elapsedTimerStartedAt);
            }, 250);
        }

        function stopElapsedTimer({ reset = false } = {}) {
            if (elapsedTimerId) {
                clearInterval(elapsedTimerId);
                elapsedTimerId = 0;
            }

            if (reset) {
                elapsedTimerStartedAt = 0;
                setElapsedTimeMs(0);
            }
        }

        const videoStatusTrackers = {
            main: { labelEl: mainVideoLabel, videoEl: remoteVideo, baseText: 'Remote', rafId: 0 },
            pip: { labelEl: pipVideoLabel, videoEl: localVideo, baseText: 'Local', rafId: 0 }
        };

        function syncVideoTrackLabel(cardKey, videoEl, baseText) {
            const tracker = videoStatusTrackers[cardKey];
            if (!tracker) return;

            tracker.videoEl = videoEl;
            tracker.baseText = baseText;

            if (tracker.labelEl) {
                tracker.labelEl.innerText = `${baseText}: ? x ?`;
            }
        }

        function updateVideoTrackLabelState(cardKey) {
            const tracker = videoStatusTrackers[cardKey];
            if (!tracker || !tracker.labelEl || !tracker.videoEl) return;

            const { videoEl } = tracker;
            const windowWidth = Math.max(0, Math.round(videoEl.clientWidth || 0));
            const windowHeight = Math.max(0, Math.round(videoEl.clientHeight || 0));
            const streamWidth = Math.max(0, Math.round(videoEl.videoWidth || 0));
            const streamHeight = Math.max(0, Math.round(videoEl.videoHeight || 0));

            const renderedWidthText = windowWidth > 0 ? windowWidth : '?';
            const renderedHeightText = windowHeight > 0 ? windowHeight : '?';
            const streamWidthText = streamWidth > 0 ? streamWidth : '?';
            const streamHeightText = streamHeight > 0 ? streamHeight : '?';

            tracker.labelEl.innerText = `${tracker.baseText}: ${renderedWidthText} x ${renderedHeightText} (${streamWidthText} x ${streamHeightText})`;

        function startVideoTrackTelemetry() {
            Object.keys(videoStatusTrackers).forEach((cardKey) => {
                const tracker = videoStatusTrackers[cardKey];
                if (!tracker) return;

                if (tracker.rafId) {
                    cancelAnimationFrame(tracker.rafId);
                }

                const tick = () => {
                    updateVideoTrackLabelState(cardKey);
                    tracker.rafId = requestAnimationFrame(tick);
                };

                tick();

        startVideoTrackTelemetry();

        function getVideoCapabilityLabel() {
            const track = localStream && localStream.getVideoTracks ? localStream.getVideoTracks()[0] : null;
            if (!track || typeof track.getCapabilities !== 'function') {
                return '';
            }

            const caps = track.getCapabilities();
            const width = Number(caps && caps.width && caps.width.max ? caps.width.max : 0) || 0;
            const height = Number(caps && caps.height && caps.height.max ? caps.height.max : 0) || 0;

            if (!width || !height) {
                return '';
            }

            return `(${width}x${height})`;
        }

        function updateCameraCapabilityText() {
            if (!videoCapabilityText) return;
            videoCapabilityText.textContent = getVideoCapabilityLabel();
        }

        function getAudioCapabilityLabel() {
            const track = localStream && localStream.getAudioTracks ? localStream.getAudioTracks()[0] : null;
            if (!track || typeof track.getCapabilities !== 'function') {
                return '';
            }

            const caps = track.getCapabilities();
            const channelCount = Number(caps && caps.channelCount && caps.channelCount.max ? caps.channelCount.max : 0) || 0;
            const sampleRate = Number(caps && caps.sampleRate && caps.sampleRate.max ? caps.sampleRate.max : 0) || 0;

            if (!channelCount && !sampleRate) {
                return '';
            }

            const channels = channelCount > 0 ? channelCount : '?';
            const rateText = sampleRate > 0 ? `${Math.round(sampleRate / 1000)}K` : '?';
            return `(${channels}, ${rateText})`;
        }

        function isLowAudioProfileEnabled() {
            return !audioProfileLowToggle || audioProfileLowToggle.checked;
        }

        function isLowVideoProfileEnabled() {
            return !videoProfileLowToggle || videoProfileLowToggle.checked;
        }

        function buildVideoConstraints(deviceId = null) {
            const constraints = isLowVideoProfileEnabled()
                ? {
                    width: { ideal: 640, max: 640 },
                    height: { ideal: 480, max: 480 },
                    frameRate: { ideal: 15, max: 15 }
                }
                : {
                    width: { ideal: 1280, max: 1280 },
                    height: { ideal: 720, max: 720 },
                    frameRate: { ideal: 20, max: 20 }
                };

            if (deviceId) {
                constraints.deviceId = { exact: deviceId };
            }

            return constraints;
        }

        function buildAudioConstraints(deviceId = null, fallback = false) {
            const constraints = isLowAudioProfileEnabled()
                ? {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
                : {
                    // Keep AEC reliable in music mode: some browser/device stacks
                    // degrade or disable echo cancellation when stereo is requested.
                    echoCancellation: true,
                    noiseSuppression: false,
                    autoGainControl: false,
                    channelCount: { ideal: 1, max: 1 },
                    sampleRate: { ideal: 48000 },
                    sampleSize: { ideal: 16 }
                };

            if (!isLowAudioProfileEnabled() && fallback) {
                delete constraints.channelCount;
                delete constraints.sampleRate;
                delete constraints.sampleSize;
            }

            if (deviceId) {
                constraints.deviceId = { exact: deviceId };
            }

            return constraints;
        }

        function getPreferredAudioBitrateBps() {
            return isLowAudioProfileEnabled() ? AUDIO_BITRATE_SPEECH_BPS : AUDIO_BITRATE_MUSIC_BPS;
        }

        function applyAudioSenderEncodingPreferences(audioSender) {
            if (!audioSender || typeof audioSender.getParameters !== 'function' || typeof audioSender.setParameters !== 'function') {
                return;
            }

            const preferredBitrateBps = getPreferredAudioBitrateBps();
            if (!Number.isFinite(preferredBitrateBps) || preferredBitrateBps <= 0) {
                return;
            }

            let audioParameters;
            try {
                audioParameters = audioSender.getParameters() || {};
            } catch (err) {
                console.warn('Audio sender parameters are unavailable:', err);
                return;
            }

            audioParameters.encodings = Array.isArray(audioParameters.encodings) && audioParameters.encodings.length > 0
                ? audioParameters.encodings.map(encoding => ({
                    ...encoding,
                    priority: 'high',
                    maxBitrate: preferredBitrateBps
                }))
                : [{ priority: 'high', maxBitrate: preferredBitrateBps }];

            audioSender.setParameters(audioParameters)
                .catch(err => console.warn('Audio sender bitrate tuning skipped by browser:', err));
        }

        function applyOpusMaxAverageBitrateToSdp(sdp, bitrateBps) {
            if (typeof sdp !== 'string' || !sdp.trim()) {
                return sdp;
            }

            if (!Number.isFinite(bitrateBps) || bitrateBps <= 0) {
                return sdp;
            }

            const newline = sdp.includes('\r\n') ? '\r\n' : '\n';
            const hasTrailingNewline = sdp.endsWith('\r\n') || sdp.endsWith('\n');
            const lines = sdp.split(/\r?\n/);

            const opusLineIndex = lines.findIndex(line => /^a=rtpmap:(\d+)\s+opus\/48000/i.test(line));
            if (opusLineIndex < 0) {
                return sdp;
            }

            const opusMatch = lines[opusLineIndex].match(/^a=rtpmap:(\d+)\s+opus\/48000/i);
            if (!opusMatch || !opusMatch[1]) {
                return sdp;
            }

            const opusPayloadType = opusMatch[1];
            const fmtpPrefix = `a=fmtp:${opusPayloadType}`;
            const fmtpLineIndex = lines.findIndex(line => line.startsWith(fmtpPrefix));

            if (fmtpLineIndex >= 0) {
                if (/maxaveragebitrate=\d+/i.test(lines[fmtpLineIndex])) {
                    lines[fmtpLineIndex] = lines[fmtpLineIndex].replace(/maxaveragebitrate=\d+/i, `maxaveragebitrate=${bitrateBps}`);
                } else {
                    lines[fmtpLineIndex] = `${lines[fmtpLineIndex]};maxaveragebitrate=${bitrateBps}`;
                }
            } else {
                lines.splice(opusLineIndex + 1, 0, `${fmtpPrefix} maxaveragebitrate=${bitrateBps}`);
            }

            const updatedSdp = lines.join(newline);
            return hasTrailingNewline ? `${updatedSdp}${newline}` : updatedSdp;
        }

        async function setLocalDescriptionWithAudioTuning(peerConn, description) {
            if (!peerConn || !description) {
                throw new Error('Peer connection and description are required.');
            }

            const preferredBitrateBps = getPreferredAudioBitrateBps();
            if (!description.sdp || !Number.isFinite(preferredBitrateBps) || preferredBitrateBps <= 0) {
                await peerConn.setLocalDescription(description);
                return peerConn.localDescription || description;
            }

            const tunedSdp = applyOpusMaxAverageBitrateToSdp(description.sdp, preferredBitrateBps);
            if (tunedSdp === description.sdp) {
                await peerConn.setLocalDescription(description);
                return peerConn.localDescription || description;
            }

            const tunedDescription = { type: description.type, sdp: tunedSdp };

            try {
                await peerConn.setLocalDescription(tunedDescription);
                return peerConn.localDescription || tunedDescription;
            } catch (err) {
                console.warn('SDP bitrate tuning was rejected, using original SDP:', err);
                await peerConn.setLocalDescription(description);
                return peerConn.localDescription || description;
            }
        }

        async function getAudioInputStream(deviceId = null) {
            const primaryConstraints = buildAudioConstraints(deviceId, false);

            try {
                return await navigator.mediaDevices.getUserMedia({ audio: primaryConstraints });
            } catch (err) {
                if (isLowAudioProfileEnabled()) {
                    throw err;
                }

                const fallbackConstraints = buildAudioConstraints(deviceId, true);
                return await navigator.mediaDevices.getUserMedia({ audio: fallbackConstraints });
            }
        }

        async function applyVideoSourceById(videoDeviceId = null) {
            if (!localStream) return;

            const newStream = await navigator.mediaDevices.getUserMedia({
                video: buildVideoConstraints(videoDeviceId)
            });

            const newVideoTrack = newStream.getVideoTracks()[0];
            const oldVideoTrack = localStream.getVideoTracks()[0];

            if (!newVideoTrack) {
                throw new Error('No video track returned for selected profile.');
            }

            if (oldVideoTrack) {
                localStream.removeTrack(oldVideoTrack);
                oldVideoTrack.stop();
            }

            localStream.addTrack(newVideoTrack);
            localVideo.srcObject = localStream;

            if (peerConnection) {
                const senders = peerConnection.getSenders();
                const videoSender = senders.find(s => s.track && s.track.kind === 'video');
                if (videoSender) {
                    await videoSender.replaceTrack(newVideoTrack);
                }
            }
        }

        async function applyAudioSourceById(audioDeviceId = null) {
            if (!localStream) return;

            const newStream = await getAudioInputStream(audioDeviceId);
            const newAudioTrack = newStream.getAudioTracks()[0];
            const oldAudioTrack = localStream.getAudioTracks()[0];

            if (!newAudioTrack) {
                throw new Error('No audio track returned for selected profile.');
            }

            const isCurrentlyMuted = muteBtn.getAttribute('data-muted') === 'true';
            newAudioTrack.enabled = !isCurrentlyMuted;

            if (oldAudioTrack) {
                localStream.removeTrack(oldAudioTrack);
                oldAudioTrack.stop();
            }

            localStream.addTrack(newAudioTrack);

            if (peerConnection) {
                const senders = peerConnection.getSenders();
                const audioSender = senders.find(s => s.track && s.track.kind === 'audio');
                if (audioSender) {
                    await audioSender.replaceTrack(newAudioTrack);
                    applyAudioSenderEncodingPreferences(audioSender);
                }
            }
        }

        function updateViewportLayoutMetrics() {
            const visualViewport = window.visualViewport;
            const viewportWidth = Math.round(visualViewport ? visualViewport.width : window.innerWidth);
            const viewportHeight = Math.round(visualViewport ? visualViewport.height : window.innerHeight);
            const isPortraitViewport = viewportHeight >= viewportWidth;

            document.documentElement.style.setProperty('--app-vh', `${viewportHeight}px`);

            const compactViewport = isPortraitViewport && viewportHeight < 700;
            document.body.classList.toggle('compact-viewport', compactViewport);

            let pipButtonWidth = 80;
            let mainButtonWidth = 94;
            if (isPortraitViewport) {
                pipButtonWidth = Math.max(66, Math.min(80, Math.floor((viewportWidth - 96) / 3)));
                mainButtonWidth = Math.max(82, Math.min(94, Math.floor((viewportWidth - 126) / 2)));
            }

            document.documentElement.style.setProperty('--pip-btn-width', `${pipButtonWidth}px`);
            document.documentElement.style.setProperty('--main-btn-width', `${mainButtonWidth}px`);
        }

        function restorePipLayout() {
            try {
                const raw = localStorage.getItem(PIP_LAYOUT_STORAGE_KEY);
                if (!raw) return;

                const parsed = JSON.parse(raw);
                const positionIndex = Number(parsed && parsed.positionIndex);
                const sizeIndex = Number(parsed && parsed.sizeIndex);

                if (Number.isInteger(positionIndex) && positionIndex >= 0 && positionIndex < PIP_POSITIONS.length) {

                if (Number.isInteger(sizeIndex) && sizeIndex >= 0 && sizeIndex < PIP_SIZES.length) {

        function isTypingIntoControl(target) {

            const tag = target.tagName ? target.tagName.toLowerCase() : '';
            return tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable;
        }

        function handleKeyboardShortcuts(event) {
            if (event.defaultPrevented || event.repeat) return;
            if (event.altKey || event.ctrlKey || event.metaKey) return;
            if (isTypingIntoControl(event.target)) return;

            const key = (event.key || '').toLowerCase();
            if (key === KEYBOARD_SHORTCUTS.call) {
                event.preventDefault();
                triggerButton(callBtn);
                return;
            }

            if (event.code === 'Space' || key === ' ' || key === 'spacebar') {
                event.preventDefault();
                triggerButton(muteBtn);
                return;
            }

            if (key === KEYBOARD_SHORTCUTS.camera) {
                event.preventDefault();
                triggerButton(camBtn);
                return;
            }

            if (key === KEYBOARD_SHORTCUTS.move) {
                event.preventDefault();
                triggerButton(moveBtn);
                return;
            }

            if (key === KEYBOARD_SHORTCUTS.swap) {
                event.preventDefault();

            if (!roomName || !localParticipantRole || !activeSessionId) return;

            const ownPresenceRef = ref(db, `rooms/${roomName}/participants/${localParticipantRole}`);
            await set(ownPresenceRef, {

        async function claimRoleSlot(roomName, role, sessionId) {
            const slotRef = ref(db, `rooms/${roomName}/participants/${role}`);
            const claimResult = await runTransaction(slotRef, currentValue => {
                if (!currentValue || !currentValue.sessionId || currentValue.sessionId === sessionId) {
                    return {
                        sessionId,
                        updatedAt: Date.now()
                    };
                }

                return;
            }, { applyLocally: false });

            return claimResult.committed;
        }

        async function evaluateRoomAction(roomName) {
            const roomSnapshot = await get(ref(db, `rooms/${roomName}`));
            if (!roomSnapshot.exists()) {
                return { mode: 'start' };
            }

            const roomData = roomSnapshot.val() || {};
            const offerData = roomData.offer || null;
            const participantsData = roomData.participants || {};
            const callerPresence = participantsData.caller || null;
            const calleePresence = participantsData.callee || null;

            const hasJoinableOffer = Boolean(
                offerData &&
                offerData.sdp &&
                offerData.sdp.type === 'offer' &&
                offerData.sessionId
            );

            if (hasJoinableOffer) {
                if (calleePresence && calleePresence.sessionId && calleePresence.sessionId === offerData.sessionId) {
                    return {
                        mode: 'full',
                        message: 'Room is already occupied by two participants.'
                    };
                }

                return {
                    mode: 'join'
                };
            }

            if ((callerPresence && callerPresence.sessionId) || (calleePresence && calleePresence.sessionId)) {
                return {
                    mode: 'busy',
                    message: 'Room is in transition. Ask both peers to disconnect and retry.'
                };
            }

            return { mode: 'start' };
        }

            }

        function unsubscribeRoomListeners() {

            peerConnection.ontrack = null;

        async function cleanupRoomArtifacts() {

            const cleanupTasks = localParticipantRole === 'caller'
                ? [
                    remove(ref(db, `${roomBasePath}/offer`)),
                    remove(ref(db, `${roomBasePath}/callerCandidates`)),
                    remove(ref(db, `${roomBasePath}/participants/caller`))
                ]
                : [

                    remove(ref(db, `${roomBasePath}/calleeCandidates`)),
                    remove(ref(db, `${roomBasePath}/participants/callee`))
                ];

            await Promise.allSettled(cleanupTasks);

        async function flushRemoteIceQueue() {

                const candidate = remoteIceQueue.shift();

                } catch (err) {

        async function discoverDevices() {
            // Fetch all connected audio and video hardware
            const devices = await navigator.mediaDevices.enumerateDevices();
            
            // Clear existing options
            audioSource.innerHTML = '';
            videoSource.innerHTML = '';

            devices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.deviceId;

                if (device.kind === 'audioinput') {
                    option.text = device.label || `Microphone ${audioSource.length + 1}`;
                    option.title = option.text;
                    audioSource.appendChild(option);
                } else if (device.kind === 'videoinput') {
                    option.text = device.label || `Camera ${videoSource.length + 1}`;
                    option.title = option.text;
                    videoSource.appendChild(option);
                }
            });

            setDeviceControlsEnabled(true);
            syncSelectedDeviceTitles();
        }

        // Step 1: Open Local Hardware Feed
        async function init() {
            try {
                // Capture media using the selected speech/music + low/high video profiles.
                const constraints = { 
                    video: buildVideoConstraints(),
                    audio: buildAudioConstraints()
                };

                try {
                    localStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (err) {
                    if (isLowAudioProfileEnabled()) {
                        throw err;
                    }

                    // Music profile fallback for browsers/drivers rejecting advanced hints.
                    localStream = await navigator.mediaDevices.getUserMedia({
                        video: buildVideoConstraints(),
                        audio: buildAudioConstraints(null, true)
                    });
                }

                localVideo.srcObject = localStream;

                // Scan the available hardware and populate your dropdown menus
                await discoverDevices();
                setCallButtonsEnabled(true);
                syncCallButtonMode();
                setPipControlsEnabled(true);
                statusText.innerText = "Camera active. Enter a key above to connect.";
            } catch (err) {
                statusText.innerText = "Error: System camera/microphone access denied.";
                setCallButtonsEnabled(false);
                syncCallButtonMode();
                setDeviceControlsEnabled(false);
                setPipControlsEnabled(false);
                console.error(err);
            }
        }

        // Step 2: Build WebRTC Engine Isolated Inside the Secret Room Node
        function createPeerConnection(roomName) {
            if (!localStream) {
                throw new Error('Local media stream is not ready.');
            }

            closePeerConnection();
            peerConnection = new RTCPeerConnection(rtcConfig);
            remoteStream = new MediaStream();
            remoteVideo.srcObject = remoteStream;
            tryPlayRemoteVideo('remote stream attached');
            remoteIceQueue = [];

            // 1. Add the local tracks using the most broadly compatible WebRTC path.
            const audioTrack = localStream.getAudioTracks()[0];
            const videoTrack = localStream.getVideoTracks()[0];

            if (audioTrack) {
                const audioSender = peerConnection.addTrack(audioTrack, localStream);
                applyAudioSenderEncodingPreferences(audioSender);
            }

            if (videoTrack) {
                const videoSender = peerConnection.addTrack(videoTrack, localStream);
                const videoParameters = videoSender.getParameters();
                videoParameters.encodings = videoParameters.encodings && videoParameters.encodings.length > 0
                    ? videoParameters.encodings.map(encoding => ({ ...encoding, priority: 'low', maxBitrate: 400000 }))
                    : [{ priority: 'low', maxBitrate: 400000 }];
                videoParameters.degradationPreference = 'maintain-framerate';
                videoSender.setParameters(videoParameters).catch(err => console.error('Video sender parameter error:', err));
            }

            peerConnection.ontrack = (event) => {
                if (!remoteStream) {
                    remoteStream = new MediaStream();
                    remoteVideo.srcObject = remoteStream;
                    tryPlayRemoteVideo('remote stream created in ontrack');
                }

                const existingTrackIds = new Set(remoteStream.getTracks().map(track => track.id));
                if (!existingTrackIds.has(event.track.id)) {
                    remoteStream.addTrack(event.track);
                }

                event.track.addEventListener('unmute', () => {
                    tryPlayRemoteVideo(`remote ${event.track.kind} unmuted`);
                });

                statusText.innerText = "Connected! Peer media stream verified.";
                tryPlayRemoteVideo(`remote ${event.track.kind} track received`);
            };

            // Write local network candidates straight to Firebase
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    const candidateId = `candidate_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
                    const candidateGroup = localParticipantRole === 'caller' ? 'callerCandidates' : 'calleeCandidates';
                    const candRef = ref(db, `rooms/${roomName}/${candidateGroup}/${candidateId}`);
                    set(candRef, {
                        sessionId: activeSessionId,
                        candidate: event.candidate.toJSON()
                    })
                        .catch(err => {
                            console.error('Failed to publish ICE candidate:', err);
                        });
                }
            };

            peerConnection.onicegatheringstatechange = null;

            peerConnection.oniceconnectionstatechange = null;

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'connected') {
                    clearJoinTimeout();
                    statusText.innerText = 'Connected! Peer connection established.';
                    return;
                }

                if (peerConnection.connectionState === 'failed') {
                    resetCallSession('Connection failed. You can try the same room key again.');
                    return;
                }
            };
        }

        // Alphanumeric character validator
        function getValidatedKey() {
            const key = roomKeyInput.value.trim().replace(/[^a-zA-Z0-9-_]/g, '');
            if (!key) {
                alert("Please enter a valid alphanumeric key.");
                return null;
            }
            return key;
        }

        async function beginStartRoom(roomName) {
            if (!ensureLocalStreamReady()) return;

            activeRoomName = roomName;
            localParticipantRole = 'caller';
            activeSessionId = createSessionId();
            remotePresenceSeen = false;
            syncCallButtonMode();
            statusText.innerText = `Initializing room "${roomName}"...`;

            try {
                const callerSlotClaimed = await claimRoleSlot(roomName, 'caller', activeSessionId);
                if (!callerSlotClaimed) {
                    await resetCallSession('Room is already occupied by another active caller.');
                    return;
                }

                // Flush stale signaling artifacts without removing the whole room container.
                await Promise.allSettled([
                    remove(ref(db, `rooms/${roomName}/offer`)),
                    remove(ref(db, `rooms/${roomName}/answer`)),
                    remove(ref(db, `rooms/${roomName}/callerCandidates`)),
                    remove(ref(db, `rooms/${roomName}/calleeCandidates`))
                ]);

                createPeerConnection(roomName);
                listenToRoom(roomName);

                const offer = await peerConnection.createOffer();
                const localOfferDescription = await setLocalDescriptionWithAudioTuning(peerConnection, offer);

                // Write the local connection configurations to the secret database cluster
                const offerRef = ref(db, `rooms/${roomName}/offer`);
                await set(offerRef, {
                    sessionId: activeSessionId,
                    sdp: { type: localOfferDescription.type, sdp: localOfferDescription.sdp }
                });

                await publishOwnPresence(roomName);

                statusText.innerText = `Room "${roomName}" created. Waiting for friend to join...`;
                startElapsedTimer({ reset: true });
            } catch (err) {
                console.error('Failed to start room:', err);
                await resetCallSession('Could not create the room. Check Firebase connectivity and try again.');
            }
        }

        async function beginJoinRoom(roomName, autoDetected = false) {
            if (!ensureLocalStreamReady()) return;

            // Joining side starts timing from user action.
            startElapsedTimer({ reset: true });

            activeRoomName = roomName;
            localParticipantRole = 'callee';
            activeSessionId = null;
            remotePresenceSeen = false;
            syncCallButtonMode();
            statusText.innerText = `Connecting to room "${roomName}"...`;

            if (autoDetected) {
                statusText.innerText = `Room "${roomName}" already exists. Joining it...`;
            }

            try {
                createPeerConnection(roomName);
                listenToRoom(roomName);
                clearJoinTimeout();
                joinTimeoutId = setTimeout(() => {
                    if (peerConnection && !peerConnection.remoteDescription) {
                        resetCallSession(`No active call was found for room "${roomName}".`);
                    }
                }, 15000);
            } catch (err) {
                console.error('Failed to join room:', err);
                await resetCallSession('Could not join the room. Check the shared key and try again.');
            }
        }

        // Unified Action: auto start or join based on room state
        callBtn.addEventListener('click', async () => {
            if (activeRoomName) {
                await resetCallSession('Disconnected. Enter a key above to call again.');
                return;
            }

            const roomName = getValidatedKey();
            if (!roomName) return;

            try {
                const decision = await evaluateRoomAction(roomName);

                if (decision.mode === 'full' || decision.mode === 'busy') {
                    statusText.innerText = decision.message;
                    return;
                }

                if (decision.mode === 'join') {
                    await beginJoinRoom(roomName, true);
                    return;
                }

                await beginStartRoom(roomName);
            } catch (err) {
                console.error('Room evaluation failed:', err);
                statusText.innerText = 'Could not evaluate room state. Try again.';
            }
        });

        // Step 3: Event Sync Engine mapped to the shared room tree
        function listenToRoom(roomName) {
            unsubscribeRoomListeners();

            const remoteSdpPath = localParticipantRole === 'caller'
                ? `rooms/${roomName}/answer`
                : `rooms/${roomName}/offer`;
            const remoteCandidatesPath = localParticipantRole === 'caller'
                ? `rooms/${roomName}/calleeCandidates`
                : `rooms/${roomName}/callerCandidates`;
            const remotePresenceRole = getRemoteParticipantRole();
            const remotePresencePath = `rooms/${roomName}/participants/${remotePresenceRole}`;

            const unsubscribeSdp = onValue(ref(db, remoteSdpPath), async (snapshot) => {
                const data = snapshot.val();
                if (!data || !peerConnection || !data.sdp) return;

                try {
                    const packetSessionId = data.sessionId || null;

                    if (localParticipantRole === 'caller') {
                        if (!packetSessionId || packetSessionId !== activeSessionId) {
                            return;
                        }
                    } else if (localParticipantRole === 'callee') {
                        if (!packetSessionId) {
                            return;
                        }

                        if (!activeSessionId) {
                            activeSessionId = packetSessionId;
                        } else if (packetSessionId !== activeSessionId) {
                            // The remote peer restarted the call while this side stayed open.
                            // Rebuild the peer connection and adopt the new signaling session.
                            if (data.sdp.type !== 'offer') {
                                return;
                            }

                            statusText.innerText = 'Remote peer restarted. Re-establishing call...';
                            createPeerConnection(roomName);
                            activeSessionId = packetSessionId;
                        }
                    }

                    if (peerConnection.remoteDescription && peerConnection.remoteDescription.sdp === data.sdp.sdp) {
                        return;
                    }

                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    await flushRemoteIceQueue();

                    if (data.sdp.type === 'offer' && localParticipantRole === 'callee' && !peerConnection.localDescription) {
                        const calleeSlotClaimed = await claimRoleSlot(roomName, 'callee', activeSessionId);
                        if (!calleeSlotClaimed) {
                            await resetCallSession('Room is already occupied by two participants.');
                            return;
                        }

                        clearJoinTimeout();
                        statusText.innerText = 'Processing call invitation...';
                        const answer = await peerConnection.createAnswer();
                        const localAnswerDescription = await setLocalDescriptionWithAudioTuning(peerConnection, answer);

                        const answerRef = ref(db, `rooms/${roomName}/answer`);
                        await set(answerRef, {
                            sessionId: activeSessionId,
                            sdp: { type: localAnswerDescription.type, sdp: localAnswerDescription.sdp }
                        });
                        statusText.innerText = 'Answer transmitted. Syncing streams...';
                    }
                } catch (err) {
                    console.error('Remote SDP handling failed:', err);
                    await resetCallSession('Signaling failed while exchanging session data. Try again.');
                }
            });

            const unsubscribeCandidates = onChildAdded(ref(db, remoteCandidatesPath), async (snapshot) => {
                const data = snapshot.val();
                if (!data || !data.candidate || !peerConnection) return;

                if (!data.sessionId || !activeSessionId || data.sessionId !== activeSessionId) return;

                try {
                    await addRemoteIceCandidate(data.candidate);
                } catch (err) {
                    console.warn('ICE candidate skipped:', err);
                }
            });

            const unsubscribeRemotePresence = onValue(ref(db, remotePresencePath), async (snapshot) => {
                const remotePresence = snapshot.val();
                if (remotePresence && remotePresence.sessionId === activeSessionId) {
                    const peerJoinedForFirstTime = !remotePresenceSeen;
                    remotePresenceSeen = true;

                    // Caller side: waiting timer switches to call-duration timer on peer join.
                    if (peerJoinedForFirstTime && localParticipantRole === 'caller') {
                        startElapsedTimer({ reset: true });
                    }
                    return;
                }

                if (remotePresenceSeen) {
                    await resetCallSession('Remote peer disconnected. You can press Call again.');
                }
            });

            signalingUnsubscribers.push(unsubscribeSdp, unsubscribeCandidates, unsubscribeRemotePresence);
        }

        // Hardware Controls: Audio Mute Switch
        muteBtn.addEventListener('click', () => {
            if (!localStream) return;

            const audioTracks = localStream.getAudioTracks();
            if (audioTracks.length > 0) {
                const isMuted = muteBtn.getAttribute('data-muted') === 'true';
                audioTracks[0].enabled = isMuted; // Toggle transmission states
                muteBtn.setAttribute('data-muted', !isMuted);
                updateToggleButtonVisuals();
            }
        });

        // Hardware Controls: Camera On/Off Toggle
        camBtn.addEventListener('click', () => {
            if (!localStream) return;

            const videoTracks = localStream.getVideoTracks();
            if (videoTracks.length > 0) {
                const isCamOff = camBtn.getAttribute('data-off') === 'true';
                videoTracks[0].enabled = isCamOff; // Toggle transmission states
                camBtn.setAttribute('data-off', !isCamOff);
                updateToggleButtonVisuals();
            }
        });

        moveBtn.addEventListener('click', () => {
            pipViewState.positionIndex = (pipViewState.positionIndex + 1) % PIP_POSITIONS.length;
            applyPipPosition();
            persistPipLayout();
        });

        swapBtn.addEventListener('click', () => {
            pipViewState.mainView = pipViewState.mainView === 'remote' ? 'local' : 'remote';
            applyMainView();
        });

        sizeBtn.addEventListener('click', () => {
            pipViewState.sizeIndex = (pipViewState.sizeIndex + 1) % PIP_SIZES.length;
            applyPipSize();
            persistPipLayout();
        });

        roomKeyInput.addEventListener('input', persistRoomKey);
        roomKeyInput.addEventListener('change', persistRoomKey);

        // Seamless Video Camera Switcher
        videoSource.addEventListener('pointerdown', (event) => {
            markDeviceSelectorOpen(event.target);
        });

        videoSource.addEventListener('click', (event) => {
            handleDeviceSelectorClick(event.target);
        });

        videoSource.addEventListener('change', async (event) => {
            if (!localStream) return;

            syncSelectedDeviceTitles();
            collapseDeviceSelector(event.target);

            const videoDeviceId = event.target.value;
            if (!videoDeviceId) return;

            try {
                await applyVideoSourceById(videoDeviceId);
            } catch (err) {
                console.error("Failed to switch camera source:", err);
                alert("Could not switch to the selected camera hardware.");
            }
        });

        // Seamless Microphone Switcher
        audioSource.addEventListener('pointerdown', (event) => {
            markDeviceSelectorOpen(event.target);
        });

        audioSource.addEventListener('click', (event) => {
            handleDeviceSelectorClick(event.target);
        });

        audioSource.addEventListener('change', async (event) => {
            if (!localStream) return;

            syncSelectedDeviceTitles();
            collapseDeviceSelector(event.target);

            const audioDeviceId = event.target.value;
            if (!audioDeviceId) return;

            try {
                await applyAudioSourceById(audioDeviceId);
            } catch (err) {
                console.error("Failed to switch microphone source:", err);
                alert("Could not switch to the selected microphone hardware.");
            }
        });

        audioProfileLowToggle.addEventListener('change', async () => {
            if (!localStream) return;

            try {
                await applyAudioSourceById(audioSource.value || null);
            } catch (err) {
                console.error('Failed to apply audio profile:', err);
                alert('Could not apply the selected audio profile.');
            }
        });

        videoProfileLowToggle.addEventListener('change', async () => {
            if (!localStream) return;

            try {
                await applyVideoSourceById(videoSource.value || null);
            } catch (err) {
                console.error('Failed to apply video profile:', err);
                alert('Could not apply the selected video profile.');
            }
        });

        // Step 4: Automatic Room Clean-up Execution
        // Triggers instantly when a participant exits the page or closes the browser tab
        function cleanupRoomOnExit() {
            if (!activeRoomName || !localParticipantRole) return;

            const roomBasePath = `rooms/${activeRoomName}`;
            if (localParticipantRole === 'caller') {
                remove(ref(db, `${roomBasePath}/offer`));
                remove(ref(db, `${roomBasePath}/callerCandidates`));
                remove(ref(db, `${roomBasePath}/participants/caller`));
            } else {
                remove(ref(db, `${roomBasePath}/answer`));
                remove(ref(db, `${roomBasePath}/calleeCandidates`));
                remove(ref(db, `${roomBasePath}/participants/callee`));
            }
        }

        window.addEventListener('beforeunload', cleanupRoomOnExit);

        registerPwaServiceWorker();

        window.onload = init;
    </script>
</body>
</html>
